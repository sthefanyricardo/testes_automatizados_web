      - name: Validate image organization
        run: |
          
          echo "Validação final da organização de imagens..."
          
          # Validar estrutura de subpastas no consolidado
          for browser in chrome firefox edge; do
            SUBFOLDER="./gh-pages/relatorio-consolidado/$browser"
            if [ -d "$SUBFOLDER" ]; then
              IMG_COUNT=$(find "$SUBFOLDER" -name "*.png" -type f 2>/dev/null | wc -l)
              echo "relatorio-consolidado/$browser/: $IMG_COUNT imagens"
              
              if [ $IMG_COUNT -gt 0 ]; then
                echo "Subpasta criada com sucesso"
                echo "Exemplos:"
                find "$SUBFOLDER" -name "*.png" -type f | head -3 | sed 's|^./gh-pages/relatorio-consolidado/||; s/^/        /'
              fi
            else
              echo "Subpasta não encontrada: $browser/"
            fi
          done
          
          # Validar relatórios individuais
          for browser in Chrome Firefox Edge; do
            FOLDER="./gh-pages/execucao-${browser,,}"
            if [ -d "$FOLDER" ]; then
              IMG_COUNT=$(find "$FOLDER" -name "*.png" -type f 2>/dev/null | wc -l)
              HTML_COUNT=$(find "$FOLDER" -name "*.html" -type f 2>/dev/null | wc -l)
              echo " execucao-${browser,,}/: $IMG_COUNT imagens, $HTML_COUNT HTMLs"
            fi
          done
          
          # Validar referências nos HTMLs consolidados
          echo "Validando referências de imagens nos HTMLs consolidados..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              FILENAME=$(basename "$html_file")
              
              # Contar referências com subpastas (chrome/, firefox/, edge/)
              SUBFOLDER_REFS=$(grep -c '\(chrome\|firefox\|edge\)/[^"]*\.png' "$html_file" 2>/dev/null || echo "0")
              
              # Contar referências diretas (sem subpasta - potencialmente quebradas)
              DIRECT_REFS=$(grep -c 'src="\./selenium-screenshot-[0-9]*\.png"' "$html_file" 2>/dev/null || echo "0")
              
              echo " $FILENAME:"
              echo "Referências com subpastas: $SUBFOLDER_REFS"
              
              if [ $DIRECT_REFS -gt 0 ]; then
                echo "Referências diretas (sem subpasta): $DIRECT_REFS"
                echo "         Estas referências podem estar quebradas!"
              else
                echo "Nenhuma referência direta - todas mapeadas corretamente"
              fi
              
              # Mostrar exemplos de referências
              if [ $SUBFOLDER_REFS -gt 0 ]; then
                echo "      Exemplos de referências:"
                grep -o '\(chrome\|firefox\|edge\)/selenium-screenshot-[0-9]*\.png' "$html_file" 2>/dev/null | head -3 | sed 's/^/        .\//'
              fi
            fi
          done

          echo "Resumo da validação:"

          TOTAL_CONSOLIDATED=$(find ./gh-pages/relatorio-consolidado -name "*.png" -type f 2>/dev/null | wc -l)
          TOTAL_INDIVIDUAL=$(find ./gh-pages/execucao-* -name "*.png" -type f 2>/dev/null | wc -l)
          
          echo "   Total de imagens no consolidado: $TOTAL_CONSOLIDATED"
          echo "   Total de imagens nas execuções individuais: $TOTAL_INDIVIDUAL"
          
          echo "Validação concluída!"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages

  # Publicar resultados via GitHub Pages (se for uma execução a partir da branch main e se o input browser for 'todos') 
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: publish-results
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || (github.ref_name == 'main' && github.event.inputs.browser == 'todos')
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        
      - name: Display Pages URL
        if: always()
        run: |
          if [ "${{ steps.deployment.outputs.page_url }}" != "" ]; then
            echo "GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"
            echo "Relatórios disponíveis em: ${{ steps.deployment.outputs.page_url }}"
            
            echo "Links diretos:"
            echo "Consolidado: ${{ steps.deployment.outputs.page_url }}relatorio-consolidado/report.html"
            echo "Chrome: ${{ steps.deployment.outputs.page_url }}execucao-chrome/report.html"
            echo "Firefox: ${{ steps.deployment.outputs.page_url }}execucao-firefox/report.html"
            echo "Edge: ${{ steps.deployment.outputs.page_url }}execucao-edge/report.html"
          else
            echo "Relatórios disponíveis nos artefatos"
          fi
