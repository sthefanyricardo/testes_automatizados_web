# 🤖 Pipeline de Testes E2E com Robot Framework + Selenium
# 
# Esta pipeline executa testes automatizados end-to-end em múltiplos navegadores,
# gera relatórios consolidados e publica os resultados no GitHub Pages.
#
# Funcionalidades:
# - ✅ Execução paralela em Chrome, Firefox e Edge
# - 🐧 Execução em Ubuntu com Robot Framework e Selenium
# - 📊 Relatórios HTML consolidados
# - 🚀 Deploy automático no GitHub Pages
# - 📸 Captura de screenshots em caso de falha
# - 💬 Notificações e comentários em PRs
# - 🎯 Cache inteligente para otimizar performance

name: E2E Tests - Selenium + Robot Framework
run-name: Testes E2E (${{ github.ref_name }}) - ${{ github.actor }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      browser:
        description: "Em qual navegador os testes devem ser executados?"
        required: false
        default: "Todos"
        type: choice
        options:
          - Todos
          - Chrome
          - Firefox
          - Edge

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  statuses: write
  checks: write

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "v1" # Incrementar para invalidar cache se necessário

jobs:
  tests:
    strategy:
      fail-fast: false # Não para outros browsers se um falhar
      max-parallel: 3 # Controla paralelismo
      matrix:
        browser: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'Todos' && fromJSON(format('["{0}"]', github.event.inputs.browser))) || fromJSON('["Chrome", "Firefox", "Edge"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Instalar webdriver-manager com versão específica mais estável
          pip install webdriver-manager==4.0.1
          
          # Instalar dependências básicas com versões estáveis para CI
          pip install selenium==4.15.0
          
          echo "Instalando dependências específicas dos módulos..."
          INSTALLED_MODULES=()
          
          # CORRIGIDO: Instalar requirements.txt de cada módulo na RAIZ do repositório
          for module in automacao_basico automacao_intermediario automacao_avancado; do
            if [ -f "$module/requirements.txt" ]; then
              echo "Instalando dependências de $module..."
              pip install -r "$module/requirements.txt"
              INSTALLED_MODULES+=("$module")
              echo "Dependências de $module instaladas"
            else
              echo "requirements.txt não encontrado em $module"
            fi
          done
          
          # Verificar se existe um requirements.txt global na raiz
          if [ -f "requirements.txt" ]; then
            echo "Instalando dependências globais..."
            pip install -r "requirements.txt"
            echo "Dependências globais instaladas"
          fi
          
          echo "Módulos com dependências instaladas: ${INSTALLED_MODULES[*]}"
          
          # Verificar versões instaladas
          echo "Verificando versões instaladas:"
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"
          echo "Faker: $(python -c 'import robot.libraries.FakerLibrary; print(\"Faker instalado\")' 2>/dev/null || echo 'Faker não encontrado')"

      - name: Create results directory
        run: |
          mkdir -p ./tests-results-CI/${{ matrix.browser }}
          echo "Diretório de resultados criado: ./tests-results-CI/${{ matrix.browser }}"
          
      - name: Setup Browser Environment
        run: |
          echo "Configurando ambiente para execução robusta..."
          
          # Verificar Robot Framework e bibliotecas instaladas
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          
          # Verificar navegadores disponíveis no Ubuntu runner (versões detalhadas)
          echo "VERIFICAÇÃO DETALHADA DE NAVEGADORES:"
          echo "=========================================="
          
          # Chrome
          if command -v google-chrome &> /dev/null; then
            CHROME_VERSION=$(google-chrome --version)
            echo "Chrome: $CHROME_VERSION"
            echo "   Caminho: $(which google-chrome)"
          else
            echo "Chrome não encontrado"
          fi
          
          # Firefox
          if command -v firefox &> /dev/null; then
            FIREFOX_VERSION=$(firefox --version)
            echo "Firefox: $FIREFOX_VERSION"
            echo "   Caminho: $(which firefox)"
          else
            echo "Firefox não encontrado"
          fi
          
          # Microsoft Edge (verificação detalhada)
          if command -v microsoft-edge &> /dev/null; then
            EDGE_VERSION=$(microsoft-edge --version)
            echo "Microsoft Edge: $EDGE_VERSION"
            echo "   Caminho: $(which microsoft-edge)"
            echo "   Edge é pré-instalado no GitHub Actions Ubuntu runner"
            echo "   Versão estável mantida automaticamente pelo GitHub"
            
            # Extrair número da versão para EdgeDriver
            EDGE_MAJOR_VERSION=$(echo "$EDGE_VERSION" | grep -oP '\d+' | head -1)
            echo "   Versão principal detectada: $EDGE_MAJOR_VERSION"
          else
            echo "Microsoft Edge não encontrado"
            echo "Isso é inesperado - Edge deveria estar pré-instalado"
          fi
          
          echo "=========================================="
          
          # Instalar Xvfb se não estiver disponível
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          
          # Configurar display virtual mais robusto
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 5
          echo "Display virtual configurado: $DISPLAY"
          
          # Configurar timeouts mais robustos para screenshots
          export SELENIUM_IMPLICIT_WAIT=30
          export SELENIUM_PAGE_LOAD_TIMEOUT=60
          export SELENIUM_SCRIPT_TIMEOUT=30

      - name: Setup EdgeDriver (Robust)
        if: matrix.browser == 'Edge'
        run: |
          echo "Configuração robusta do EdgeDriver para Microsoft Edge..."
          
          # Detectar versão do Edge
          if command -v microsoft-edge &> /dev/null; then
            EDGE_VERSION=$(microsoft-edge --version | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1)
            EDGE_MAJOR_VERSION=$(echo "$EDGE_VERSION" | cut -d. -f1)
            echo "Edge detectado: $EDGE_VERSION (Major: $EDGE_MAJOR_VERSION)"
          else
            echo "Edge não encontrado!"
            exit 1
          fi
          
          # Criar diretório para drivers
          mkdir -p ~/.cache/selenium/edgedriver
          
          # URLs alternativas para EdgeDriver
          EDGEDRIVER_URLS=(
            "https://msedgedriver.azureedge.net/${EDGE_VERSION}/edgedriver_linux64.zip"
            "https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/"
            "https://github.com/MicrosoftDocs/edge-developer/raw/main/microsoft-edge/webdriver-chromium/webdriver-chromium.md"
          )
          
          echo "Tentando baixar EdgeDriver versão $EDGE_VERSION..."
          
          # Método 1: Tentar webdriver-manager primeiro (com timeout)
          echo "Método 1: webdriver-manager (com timeout de 30s)..."
          timeout 30s python -c "
          try:
              from webdriver_manager.microsoft import EdgeChromiumDriverManager
              driver_path = EdgeChromiumDriverManager().install()
              print(f'EdgeDriver instalado via webdriver-manager: {driver_path}')
              with open('/tmp/edgedriver_path.txt', 'w') as f:
                  f.write(driver_path)
          except Exception as e:
              print(f'webdriver-manager falhou: {e}')
              exit(1)
          " || echo "webdriver-manager timeout ou falhou"
          
          # Verificar se o webdriver-manager funcionou
          if [ -f "/tmp/edgedriver_path.txt" ]; then
            DRIVER_PATH=$(cat /tmp/edgedriver_path.txt)
            echo "EdgeDriver configurado com sucesso: $DRIVER_PATH"
            echo "Verificando driver:"
            ls -la "$DRIVER_PATH" 2>/dev/null || echo "Arquivo não encontrado"
          else
            echo "webdriver-manager falhou, usando método alternativo..."
            
            # Método 2: Download manual (fallback)
            echo "Método 2: Download manual..."
            DRIVER_URL="https://msedgedriver.azureedge.net/${EDGE_VERSION}/edgedriver_linux64.zip"
            
            # Usar curl com timeout e retry
            if curl -L --max-time 30 --retry 3 --retry-delay 5 -o /tmp/edgedriver.zip "$DRIVER_URL"; then
              echo "EdgeDriver baixado com sucesso"
              
              # Extrair e configurar
              cd ~/.cache/selenium/edgedriver
              unzip -q /tmp/edgedriver.zip
              chmod +x msedgedriver
              echo "EdgeDriver extraído e configurado"
              
              # Adicionar ao PATH
              export PATH="$HOME/.cache/selenium/edgedriver:$PATH"
              echo "EdgeDriver adicionado ao PATH"
            else
              echo "Falha no download manual do EdgeDriver"
              echo "Continuando sem configuração específica (Selenium pode usar driver padrão)"
            fi
          fi
          
          echo "Configuração do EdgeDriver concluída"

      - name: Run E2E Tests
        run: |
          echo "Executando testes para o navegador: ${{ matrix.browser }}"
          
          # Converter nome do navegador para lowercase (necessário para SeleniumLibrary)
          BROWSER=$(echo "${{ matrix.browser }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Navegador configurado: $BROWSER"
          
          # Configurar display para execução headless
          export DISPLAY=:99
          
          # Pré-configuração do WebDriver para evitar timeouts
          echo "Pré-configurando WebDriver para $BROWSER..."
          if [ "$BROWSER" = "edge" ]; then
            echo "Configurações especiais para Microsoft Edge:"
            echo "  - Timeout de screenshot aumentado para 180s"
            echo "  - Timeout de carregamento de página aumentado para 90s"
            echo "  - Aguardo implícito aumentado para 45s"
            echo "  - Velocidade de selenium reduzida para 0.5s"
          else
            echo "Configurações padrão para $BROWSER:"
            echo "  - Timeout de screenshot: 120s"
            echo "  - Timeout de carregamento de página: 60s"
            echo "  - Aguardo implícito: 30s"
          fi
          echo ""
          
          # Executar Robot Framework com configurações robustas
          set +e # Não falhar se robot retornar código de erro
          
          # Configurações específicas por navegador
          EXTRA_ARGS=""
          if [ "$BROWSER" = "edge" ]; then
            echo "Aplicando configurações específicas para Edge..."
            EXTRA_ARGS="--variable SCREENSHOT_TIMEOUT:180 --variable IMPLICIT_WAIT:45 --variable PAGE_LOAD_TIMEOUT:90"
          else
            EXTRA_ARGS="--variable SCREENSHOT_TIMEOUT:120 --variable IMPLICIT_WAIT:30 --variable PAGE_LOAD_TIMEOUT:60"
          fi
          
          robot \
            --name "Tests E2E - Robot Framework CI (${{ matrix.browser }})" \
            --outputdir ./tests-results-CI/${{ matrix.browser }} \
            --variable BROWSER:$BROWSER \
            --variable HEADLESS:true \
            --variable TIMEOUT:45 \
            --variable WINDOW_SIZE:1920x1080 \
            --variable SELENIUM_SPEED:0.5 \
            --variable CAPTURE_PAGE_SCREENSHOT_ON_FAILURE:true \
            --variable BROWSER_PREFIX:${{ matrix.browser }} \
            --loglevel INFO \
            --reporttitle "Relatório E2E - ${{ matrix.browser }}" \
            --name "Relatório E2E - ${{ matrix.browser }}" \
            --maxerrorlines 10 \
            --include "*" \
            $EXTRA_ARGS \
            automacao_basico/tests automacao_intermediario/tests automacao_avancado/tests
          
          ROBOT_EXIT_CODE=$?
          echo "Robot Framework finalizado com código: $ROBOT_EXIT_CODE"
          
          if [ $ROBOT_EXIT_CODE -eq 0 ]; then
            echo "PERFEITO! Todos os testes passaram!"
            exit 0  # Força sucesso total
          elif [ $ROBOT_EXIT_CODE -le 250 ]; then
            echo "Alguns testes falharam, mas a execução foi bem-sucedida"
            echo "Relatórios gerados com sucesso para análise"
            exit 0  # Considera como sucesso para o pipeline
          else
            echo "Erro crítico na execução dos testes"
            exit 1  # Só falha em erro crítico real
          fi

      - name: Capture Screenshots and Evidence
        if: always()  # Sempre capturar, não apenas em falha
        run: |
          echo "Verificando evidências e screenshots gerados..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          # Verificar screenshots gerados pelo Robot Framework (apenas contagem, sem duplicar)
          echo "Verificando imagens geradas pelo Robot Framework..."
          IMAGES_FOUND=0
          
          # Contar PNGs no diretório principal (onde o Robot Framework os gera)
          if find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
            MAIN_IMAGES=$(find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
            echo "  $MAIN_IMAGES screenshots encontrados no diretório principal"
            IMAGES_FOUND=$MAIN_IMAGES
          fi
          
          # Verificar se há imagens em subdiretórios (casos especiais)
          SUB_IMAGES=$(find "$RESULTS_DIR" -mindepth 2 -name "*.png" -type f | wc -l)
          if [ $SUB_IMAGES -gt 0 ]; then
            echo "  $SUB_IMAGES imagens adicionais encontradas em subdiretórios"
            IMAGES_FOUND=$((IMAGES_FOUND + SUB_IMAGES))
          fi
          
          # Resumo sem duplicação
          echo "Resumo da coleta de evidências:"
          echo "  Total de screenshots únicos: $IMAGES_FOUND"
          if [ $IMAGES_FOUND -gt 0 ]; then
            echo "  Exemplos de screenshots disponíveis:"
            find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | head -5 | while read img; do
              echo "    - $(basename "$img")"
            done
          else
            echo "  Nenhum screenshot encontrado"
          fi
          
          # Informações do ambiente para debug (apenas se houver falha)
          if [ "${{ job.status }}" = "failure" ]; then
            echo "Informações do ambiente para debug:"
            echo "  Display: $DISPLAY"
            echo "  Processos ativos:"
            ps aux | grep -E "(Xvfb|chrome|firefox|edge)" | head -5 || echo "  Nenhum processo de navegador ativo"
          fi
        continue-on-error: true

      - name: Check Test Results
        if: always()
        run: |
          echo "Verificando resultados dos testes para ${{ matrix.browser }}..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          if [ -f "$RESULTS_DIR/output.xml" ]; then
            echo "Arquivo output.xml encontrado!"
            echo "Conteúdo do diretório de resultados:"
            ls -la "$RESULTS_DIR/"
            echo ""
            
            # Listar arquivos de saída gerados
            echo "Arquivos de relatório gerados:"
            [ -f "$RESULTS_DIR/report.html" ] && echo "  report.html ($(stat -c%s "$RESULTS_DIR/report.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/log.html" ] && echo "  log.html ($(stat -c%s "$RESULTS_DIR/log.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/output.xml" ] && echo "  output.xml ($(stat -c%s "$RESULTS_DIR/output.xml" 2>/dev/null || echo "?") bytes)"
          else
            echo "Arquivo output.xml não encontrado!"
            echo "Conteúdo disponível no diretório:"
            ls -la "$RESULTS_DIR/" 2>/dev/null || echo "Diretório de resultados não existe"
          fi

      - name: Upload Test Results (Essential Files Only)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests-results-CI/${{ matrix.browser }}/output.xml
            tests-results-CI/${{ matrix.browser }}/report.html
            tests-results-CI/${{ matrix.browser }}/log.html
            tests-results-CI/${{ matrix.browser }}/*.png
          retention-days: 7  # Reduzido de 30 para 7 dias
          if-no-files-found: warn

  # Job para consolidar resultados e publicar no GitHub Pages
  publish-results:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: ./all-results

      - name: Debug - Check downloaded artifacts
        run: |
          echo "Verificando artefatos baixados..."
          echo "Estrutura do diretório all-results:"
          ls -laR ./all-results/ || echo "Diretório all-results não encontrado"
          echo ""

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Copy images before consolidation
        run: |
          echo "ESTRATÉGIA DE PREFIXOS: Todas as imagens no relatorio-consolidado com prefixos por navegador..."
          mkdir -p ./gh-pages
          mkdir -p ./gh-pages/relatorio-consolidado
          
          IMAGES_FOUND=0
          
          echo "Estratégia de organização para as imagens:"
          echo "1. Manter nomes originais das imagens (selenium-screenshot-X.png) para as execuções unitarias por navegador"
          echo "2. Pastas separadas apenas para relatórios individuais - Organizar em pastas separadas por navegador"
          echo "3. Cópias individuais nas pastas execucao-* (nomes originais)"
          echo "4. Todas as imagens que precisam ficar em relatorio-consolidado/ (na raiz da pasta)"
          echo "5. Prefixos por navegador: chrome-, firefox-, edge- para as imagens no relatorio-consolidado/"
          echo "6. Nomes: chrome-selenium-screenshot-X.png, firefox-selenium-screenshot-X.png"
          echo "7. Raiz do artifact LIMPA (só index.html)"
          echo "8. Compatível com GitHub Pages (imagens na mesma pasta dos HTMLs)"

          # Processar cada navegador com estratégia de PREFIXOS
          for browser in Chrome Firefox Edge; do
            BROWSER_DIR="./all-results/test-results-$browser"
            BROWSER_INDIVIDUAL="./gh-pages/execucao-${browser,,}"
            PREFIX="${browser,,}-"
            
            if [ -d "$BROWSER_DIR" ]; then
              echo "  Processando $browser..."
              mkdir -p "$BROWSER_INDIVIDUAL"
              
              # Verificar se há PNGs
              if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                PNG_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                
                # 1. Copiar para pasta individual com nomes originais
                find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "$BROWSER_INDIVIDUAL/" \;
                echo "    Copiadas para $BROWSER_INDIVIDUAL/ (nomes originais)"
                
                # 2. Copiar para relatorio-consolidado COM PREFIXOS
                find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | while read img; do
                  filename=$(basename "$img")
                  new_name="${PREFIX}${filename}"
                  cp "$img" "./gh-pages/relatorio-consolidado/$new_name"
                done
                
                echo "    Copiadas para relatorio-consolidado/ com prefixo '$PREFIX'"
                IMAGES_FOUND=$((IMAGES_FOUND + PNG_COUNT * 2))  # Individual + consolidado

                # Mostrar exemplos de imagens copiadas sem renomeação
                echo "    Exemplos copiados na pasta individual:"
                find "$BROWSER_INDIVIDUAL" -name "*.png" -type f | head -3 | sed 's/^/      /'

                # Mostrar exemplos das imagens copiadas com prefixos
                echo "    Exemplos com prefixos criados no consolidado:"
                ls -1 "./gh-pages/relatorio-consolidado/${PREFIX}"*.png 2>/dev/null | head -3 | sed 's/^/      /'
                
              else
                echo "    Nenhuma imagem encontrada em $browser"
              fi
            else
              echo "    Diretório não encontrado: $BROWSER_DIR"
            fi
          done

          echo ""
          echo "📊 RESUMO DA ESTRATÉGIA DE PREFIXOS:"
          echo "   Total de imagens organizadas: $IMAGES_FOUND"
          echo "   🎯 Todas as imagens do consolidado em: ./gh-pages/relatorio-consolidado/"
          echo "   🚫 Raiz do artifact: LIMPA (0 imagens)"
          echo "   ✅ GitHub Pages: Compatível (imagens co-localizadas com HTMLs)"
        continue-on-error: true

      - name: Create consolidated report with rebot
        run: |
          # Verificar se existem arquivos output.xml
          OUTPUT_FILES=$(find ./all-results -name "output.xml" -type f 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$OUTPUT_FILES" ]; then
            echo " Nenhum arquivo output.xml encontrado. Criando página de status..."
            cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Relatório E2E - Status</title>
            <meta charset="utf-8">
          </head>
          <body>
            <h1>Pipeline em Execução</h1>
            <p>Os testes estão sendo executados. Os relatórios serão disponibilizados em breve.</p>
            <p>Status: <strong>Aguardando resultados dos testes</strong></p>
          </body>
          </html>
          EOF
            echo " Página de status criada"
          else
            echo " Arquivos output.xml encontrados:"
            echo "$OUTPUT_FILES"
            echo ""
            echo " Lista detalhada dos arquivos que serão consolidados:"
            for file in $OUTPUT_FILES; do
              echo "  - $file ($(stat -c%s "$file" 2>/dev/null || echo "?" ) bytes)"
            done
            echo ""
            
            # Executar rebot com tratamento de falhas
            set +e
            echo " Executando rebot com os arquivos encontrados..."
            
            # Executar rebot no mesmo diretório onde estão as imagens
            cd ./gh-pages
            python -m robot.rebot \
              --output output.xml \
              --log log.html \
              --report report.html \
              --reporttitle "Relatório Consolidado E2E" \
              --name "Relatório Consolidado E2E" \
              ../all-results/*/output.xml
            cd ..
            
            REBOT_EXIT_CODE=$?
            echo "Rebot finalizado com código: $REBOT_EXIT_CODE"
            
            # Verificar arquivos gerados
            echo "Arquivos gerados pelo rebot:"
            ls -la ./gh-pages/ || echo "Diretório gh-pages não encontrado"
            
            if [ $REBOT_EXIT_CODE -eq 0 ]; then
              echo "Relatório consolidado gerado com sucesso!"
            elif [ $REBOT_EXIT_CODE -le 250 ]; then
              echo "Relatório consolidado gerado com alguns testes falhando"
              echo "Relatório disponível para análise"
            else
              echo "Erro crítico na geração do relatório"
              # Criar relatório de erro
              cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Relatório E2E - Erro</title>
            <meta charset="utf-8">
          </head>
          <body>
            <h1>Erro na Consolidação</h1>
            <p>Houve um erro ao consolidar os relatórios dos testes.</p>
            <p>Verifique os artefatos individuais de cada navegador.</p>
          </body>
          </html>
          EOF
            fi
            
            # Pós-processamento: corrigir caminhos de imagens nos HTMLs gerados
            echo " Pós-processamento: corrigindo caminhos de imagens..."
            for html_file in ./gh-pages/*.html; do
              if [ -f "$html_file" ]; then
                # Corrigir qualquer caminho absoluto ou relativo complexo para imagens
                sed -i 's|src="[^"]*\/\([^"\/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null || true
                sed -i 's|href="[^"]*\/\([^"\/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null || true
                # Remover caminhos que contenham diretórios de teste
                sed -i 's|src="[^"]*tests-results-CI[^"]*\/\([^"\/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null || true
                echo "    Caminhos corrigidos em $(basename "$html_file")"
              fi
            done
            
            # Verificar se as imagens estão realmente disponíveis
            IMAGE_COUNT=$(find ./gh-pages -maxdepth 1 -name "*.png" -type f | wc -l)
            echo "Verificação final: $IMAGE_COUNT imagens disponíveis na raiz"
          fi
        continue-on-error: true

      - name: Copy additional assets
        run: |
          echo "Organizando assets em estrutura de pastas..."
          
          # Criar estrutura de pastas organizada
          echo "Criando estrutura de pastas..."
          mkdir -p "./gh-pages/relatorio-consolidado"
          echo "  Pasta criada: relatorio-consolidado/"
          
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            mkdir -p "./gh-pages/$FOLDER_NAME"
            echo "  Pasta criada: $FOLDER_NAME/"
          done
          
          # Mover arquivos consolidados para pasta dedicada
          echo " Organizando relatórios consolidados..."
          if [ -f "./gh-pages/report.html" ]; then
            mv "./gh-pages/report.html" "./gh-pages/relatorio-consolidado/"
            echo "   report.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/log.html" ]; then
            mv "./gh-pages/log.html" "./gh-pages/relatorio-consolidado/"
            echo "   log.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/output.xml" ]; then
            mv "./gh-pages/output.xml" "./gh-pages/relatorio-consolidado/"
            echo "   output.xml → relatorio-consolidado/"
          fi
          
          # NÃO mover imagens soltas - elas ficarão organizadas apenas nas pastas por navegador
          echo "Imagens já organizadas diretamente no relatorio-consolidado com prefixos por navegador"
          
          # Organizar relatórios individuais por navegador
          echo "Organizando relatórios individuais por navegador..."
          for browser in Chrome Firefox Edge; do
            BROWSER_DIR="./all-results/test-results-$browser"
            FOLDER_NAME="execucao-${browser,,}"
            
            if [ -d "$BROWSER_DIR" ]; then
              echo "  Processando $browser..."
              
              # Copiar arquivos individuais para pasta do navegador
              if [ -f "$BROWSER_DIR/report.html" ]; then
                cp "$BROWSER_DIR/report.html" "./gh-pages/$FOLDER_NAME/"
                echo "    report.html → $FOLDER_NAME/"
              fi
              if [ -f "$BROWSER_DIR/log.html" ]; then
                cp "$BROWSER_DIR/log.html" "./gh-pages/$FOLDER_NAME/"
                echo "    log.html → $FOLDER_NAME/"
              fi
              if [ -f "$BROWSER_DIR/output.xml" ]; then
                cp "$BROWSER_DIR/output.xml" "./gh-pages/$FOLDER_NAME/"
                echo "    output.xml → $FOLDER_NAME/"
              fi
            fi
          done
          
          # Corrigir caminhos das imagens nos arquivos HTML
          echo "Corrigindo caminhos das imagens nos arquivos HTML..."
          # Corrigir relatórios consolidados (imagens na mesma pasta) - PADRÕES SUPER ROBUSTOS
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              # Debug: mostrar imagens disponíveis
              if [ "$(basename "$html_file")" = "log.html" ]; then
                echo "    Debug: Imagens disponíveis na pasta consolidada:"
                ls -la ./gh-pages/relatorio-consolidado/*.png 2>/dev/null | head -5 | sed 's/^/      /' || echo "      Nenhuma imagem PNG encontrada"
                echo "    Debug: Referências de imagem ANTES da correção em log.html:"
                grep -o 'src="[^"]*\.png"' "$html_file" 2>/dev/null | head -5 | sed 's/^/      /' || echo "      Nenhuma referência encontrada"
              fi
              
              echo "    Corrigindo $(basename "$html_file") com padrões robustos..."
              
              # CORREÇÕES ESPECÍFICAS PARA ROBOT FRAMEWORK - ORDEM IMPORTANTE!
              
              # Debug detalhado para log.html
              if [ "$(basename "$html_file")" = "log.html" ]; then
                echo "     Debug ANTES da correção:"
                echo "      Imagens disponíveis na pasta:"
                ls -la ./gh-pages/relatorio-consolidado/*.png 2>/dev/null | wc -l | xargs -I {} echo "        {} imagens PNG encontradas"
                echo "      Primeiras 3 referências de imagem no HTML:"
                grep -o 'src="[^"]*\.png"' "$html_file" 2>/dev/null | head -3 | sed 's/^/        /' || echo "        Nenhuma referência encontrada"
              fi
              
              # 1. Robot Framework gera caminhos absolutos - converter para relativos
              # Padrões como: src="/home/runner/work/.../screenshot.png" → src="./screenshot.png"
              sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
              
              # 2. Corrigir caminhos com múltiplas barras
              sed -i 's|src="[^"]*//[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              
              # 3. Corrigir caminhos com diretórios específicos do CI
              sed -i 's|src="[^"]*tests-results-CI[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|src="[^"]*test-results[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|src="[^"]*all-results[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              
              # 4. Corrigir caminhos com browser específico
              sed -i 's|src="[^"]*[Cc]hrome[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|src="[^"]*[Ff]irefox[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|src="[^"]*[Ee]dge[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              
              # 5. Limpar qualquer caminho relativo complexo restante
              sed -i 's|src="\.\./[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|src="\./[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              
              # 6. ESTRATÉGIA DE PREFIXOS - mapear selenium-screenshot para imagens com prefixos
              echo "    Aplicando mapeamento inteligente para estratégia de PREFIXOS..."
              
              # Primeiro, converter caminhos absolutos para relativos básicos
              sed -i 's|src="[^"]*[/\\]\([^/\\]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              
              # Mapear selenium-screenshot-X.png para NAVEGADOR-selenium-screenshot-X.png
              # Estratégia: Todas as imagens renomeadas com prefixos estão na RAIZ do relatorio-consolidado
              for img_ref in $(grep -o 'src="\./selenium-screenshot-[0-9]*\.png"' "$html_file" 2>/dev/null | sed 's/src="\.\///; s/"//' | sort | uniq); do
                if [ -n "$img_ref" ]; then
                  # Verificar qual imagem com prefixo existe (chrome-, firefox-, edge-)
                  FOUND_WITH_PREFIX=""
                  for prefix in chrome firefox edge; do
                    prefixed_name="${prefix}-${img_ref}"
                    if [ -f "./gh-pages/relatorio-consolidado/$prefixed_name" ]; then
                      FOUND_WITH_PREFIX="$prefixed_name"
                      break
                    fi
                  done
                  
                  if [ -n "$FOUND_WITH_PREFIX" ]; then
                    echo "      Mapeando: $img_ref → $FOUND_WITH_PREFIX"
                    # Substituir referência para usar a imagem com prefixo
                    sed -i "s|src=\"\.\/$img_ref\"|src=\"./$FOUND_WITH_PREFIX\"|g" "$html_file" 2>/dev/null
                    sed -i "s|href=\"\.\/$img_ref\"|href=\"./$FOUND_WITH_PREFIX\"|g" "$html_file" 2>/dev/null
                  else
                    echo "      Imagem não encontrada com nenhum prefixo: $img_ref"
                  fi
                fi
              done
              
              # Debug APÓS correção inteligente para log.html
              if [ "$(basename "$html_file")" = "log.html" ]; then
                echo "      Debug APÓS correção inteligente:"
                echo "      Primeiras 3 referências corrigidas:"
                grep -o 'src="[^"]*\.png"' "$html_file" 2>/dev/null | head -3 | sed 's/^/        /' || echo "        Nenhuma referência encontrada"
                echo "      Verificando referências para subpastas:"
                grep -o 'src="\./images-[^"]*\.png"' "$html_file" 2>/dev/null | head -3 | sed 's/^/        /' || echo "        Nenhuma referência para subpastas"
              fi
              
              echo "    Relatório consolidado: $(basename "$html_file")"
            fi
          done
          
          # Corrigir relatórios individuais (imagens na própria pasta)
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            for html_file in ./gh-pages/$FOLDER_NAME/*.html; do
              if [ -f "$html_file" ]; then
                echo "    Corrigindo relatório individual $FOLDER_NAME: $(basename "$html_file")"
                
                # Corrigir caminhos para usar imagens locais da própria pasta
                sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
                sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
                
                # Corrigir caminhos específicos do CI
                sed -i 's|src="[^"]*tests-results-CI[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
                sed -i 's|src="[^"]*test-results[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
                
                # Verificar se as imagens estão disponíveis na pasta
                LOCAL_IMAGES=$(find "./gh-pages/$FOLDER_NAME" -name "*.png" -type f | wc -l)
                if [ $LOCAL_IMAGES -gt 0 ]; then
                  echo "      $LOCAL_IMAGES imagens disponíveis localmente"
                else
                  echo "      Nenhuma imagem local - relatório pode não exibir screenshots"
                fi
              fi
            done
          done
          
          # Resumo da estrutura de organização das imagens com PREFIXOS somente para o relatório consolidado
          echo "Estrutura de organização implementada:"
          echo "  📂 relatorio-consolidado/"
          echo "    ├── report.html, log.html, output.xml (relatórios consolidados)"
          echo "    ├── chrome-selenium-screenshot-*.png (imagens Chrome)"
          echo "    ├── firefox-selenium-screenshot-*.png (imagens Firefox)"
          echo "    └── edge-selenium-screenshot-*.png (imagens Edge)"
          echo "  📂 execucao-chrome/, execucao-firefox/, execucao-edge/ (imagens individuais e sem renomeação)"
          
          echo "Assets adicionais processados com sucesso!"
        continue-on-error: true

      - name: Create asset index page
        run: |
          echo "Criando página de índice de assets..."
          
          # Debug: verificar estrutura atual
          echo "Debug - Estrutura atual do gh-pages:"
          ls -la ./gh-pages/ || echo "Diretório gh-pages não encontrado"
          echo ""
          echo "Debug - Imagens encontradas:"
          find ./gh-pages -name "*.png" -type f | head -10 || echo "Nenhuma imagem encontrada"
          echo ""
          
          # Criar página principal (assets como index.html)
          cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Assets dos Testes E2E - Organizado</title>
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
              .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
              h1 { color: #333; text-align: center; font-size: 2.5em; margin-bottom: 10px; font-weight: 300; }
              h2 { color: #555; font-weight: 400; }
              .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin: 30px 0; }
              .asset-card { border: 1px solid #e1e5e9; border-radius: 12px; padding: 20px; background: #fafbfc; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
              .asset-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
              .asset-card h3 { margin-top: 0; color: #333; font-weight: 600; }
              .asset-list { list-style: none; padding: 0; margin: 15px 0; }
              .asset-list li { padding: 8px 0; }
              .asset-list a { text-decoration: none; color: #0366d6; font-weight: 500; transition: color 0.2s; }
              .asset-list a:hover { color: #0056b3; text-decoration: underline; }
              .folder-icon { color: #f39c12; margin-right: 8px; font-size: 1.1em; }
              .file-icon { color: #27ae60; margin-right: 8px; }
              .description { font-size: 13px; color: #6a737d; margin-top: 10px; line-height: 1.4; }
              
              /* Melhorias para o card principal */
              .asset-card a[style*="rgba(255,255,255,0.2)"]:hover {
                background: rgba(255,255,255,0.3) !important;
                transform: scale(1.05);
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📊 Artefatos gerados na execução do pipeline de CI</h1>
              <hr>
              <h2 >ℹ️ Estrutura de Pastas</h2>
              <hr>
              <div class="asset-grid">
                <div class="asset-card">
                  <h3><span class="folder-icon">📂</span>Relatório Consolidado</h3>
                  <ul class="asset-list">
                    <li><a href="relatorio-consolidado/report.html"><span class="file-icon">📊</span>Relatório Unificado</a></li>
                    <li><a href="relatorio-consolidado/log.html"><span class="file-icon">📋</span>Log Completo</a></li>
                    <li><a href="relatorio-consolidado/output.xml"><span class="file-icon">📄</span>XML Consolidado</a></li>
                  </ul>
                  <div class="description">Contém todos os resultados unificados + screenshots</div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="folder-icon">📂</span>Execução Chrome</h3>
                  <ul class="asset-list">
                    <li><a href="execucao-chrome/report.html"><span class="file-icon">📊</span>Relatório Chrome</a></li>
                    <li><a href="execucao-chrome/log.html"><span class="file-icon">📋</span>Log Chrome</a></li>
                    <li><a href="execucao-chrome/output.xml"><span class="file-icon">📄</span>XML Chrome</a></li>
                  </ul>
                  <div class="description">Resultados específicos do navegador Chrome</div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="folder-icon">📂</span>Execução Firefox</h3>
                  <ul class="asset-list">
                    <li><a href="execucao-firefox/report.html"><span class="file-icon">📊</span>Relatório Firefox</a></li>
                    <li><a href="execucao-firefox/log.html"><span class="file-icon">📋</span>Log Firefox</a></li>
                    <li><a href="execucao-firefox/output.xml"><span class="file-icon">📄</span>XML Firefox</a></li>
                  </ul>
                  <div class="description">Resultados específicos do navegador Firefox</div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="folder-icon">📂</span>Execução Edge</h3>
                  <ul class="asset-list">
                    <li><a href="execucao-edge/report.html"><span class="file-icon">📊</span>Relatório Edge</a></li>
                    <li><a href="execucao-edge/log.html"><span class="file-icon">📋</span>Log Edge</a></li>
                    <li><a href="execucao-edge/output.xml"><span class="file-icon">📄</span>XML Edge</a></li>
                  </ul>
                  <div class="description">Resultados específicos do navegador Edge</div>
                </div>
              </div>
          EOF
          
          # Finalizar HTML com informações da estrutura organizada
          cat >> ./gh-pages/index.html << 'EOF'
              
              <!-- Seção de informações adicionais -->
              <div style="margin-top: 50px; padding: 25px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 12px; border-left: 4px solid #28a745;">
                <h3 style="margin-top: 0; color: #495057;">ℹ️ Sobre os Relatórios</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
                  <div>
                    <h4 style="color: #495057; margin: 0 0 10px 0;">📂 Relatório Consolidado</h4>
                    <p style="margin: 0; color: #6c757d; font-size: 14px;">Contém todos os resultados unificados e screenshots centralizados para evitar duplicação</p>
                  </div>
                  <div>
                    <h4 style="color: #495057; margin: 0 0 10px 0;">🖼️ Screenshots</h4>
                    <p style="margin: 0; color: #6c757d; font-size: 14px;">Todas as evidências visuais centralizadas no relatório consolidado</p>
                  </div>
                  <div>
                    <h4 style="color: #495057; margin: 0 0 10px 0;">🌐 Relatórios Individuais</h4>
                    <p style="margin: 0; color: #6c757d; font-size: 14px;">Resultados específicos de cada navegador com XMLs individuais disponíveis</p>
                  </div>
                </div>
              </div>
              
              <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e1e5e9;">
                <p style="color: #6a737d; font-size: 14px; margin: 0;">
                  🤖 Gerado automaticamente pelo GitHub Actions 
                </p>
              </div>
            </div>
          </body>
          </html>
          EOF
          
          echo "Página principal criada: index.html (estrutura organizada)"
          
          # Verificação final SIMPLIFICADA dos caminhos de imagem no consolidado
          echo "Verificação final dos caminhos de imagem no consolidado..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   Processando $(basename "$html_file")..."
              
              # Debug: mostrar exemplos de referências ANTES da correção
              echo "     Exemplos de referências ANTES da correção:"
              grep -o 'src="[^"]*\.png"' "$html_file" | head -3 | sed 's/^/      /' || echo "      Nenhuma referência PNG encontrada"
              
              # Correção SIMPLES: Robot Framework gera "selenium-screenshot-X.png" e as imagens já estão na pasta
              echo "     Aplicando correção simples de caminhos..."
              
              # Corrigir caminhos absolutos para relativos
              sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
              
              # Debug: mostrar exemplos APÓS a correção
              echo "     Exemplos de referências APÓS a correção:"
              grep -o 'src="[^"]*\.png"' "$html_file" | head -3 | sed 's/^/      /' || echo "      Nenhuma referência PNG encontrada"
              
              # Verificar se ainda há caminhos problemáticos
              PROBLEM_PATHS=$(grep -c 'src="[^"]*\/[^"]*\.png"' "$html_file" 2>/dev/null || echo "0")
              if [ "$PROBLEM_PATHS" -eq 0 ]; then
                echo "     Todos os caminhos corrigidos em $(basename "$html_file")"
              else
                echo "     Ainda há $PROBLEM_PATHS caminhos com subdiretórios"
              fi
            fi
          done
          
          # Validação final: verificar se as imagens estão acessíveis
          echo " Validação final: verificando se imagens estão acessíveis..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   Validando imagens em $(basename "$html_file"):"
              
              # Extrair todas as referências de imagem
              IMAGE_REFS=$(grep -o 'src="[^"]*\.png"' "$html_file" 2>/dev/null | sed 's/src="//;s/"//' | sort | uniq)
              
              if [ -n "$IMAGE_REFS" ]; then
                VALID_IMAGES=0
                INVALID_IMAGES=0
                
                echo "     Referências encontradas:"
                while IFS= read -r img_ref; do
                  if [ -n "$img_ref" ]; then
                    # Construir caminho completo
                    if [[ "$img_ref" == "./"* ]]; then
                      FULL_PATH="./gh-pages/relatorio-consolidado/${img_ref#./}"
                    else
                      FULL_PATH="./gh-pages/relatorio-consolidado/$img_ref"
                    fi
                    
                    if [ -f "$FULL_PATH" ]; then
                      VALID_IMAGES=$((VALID_IMAGES + 1))
                      echo "      $img_ref"
                    else
                      INVALID_IMAGES=$((INVALID_IMAGES + 1))
                      echo "       $img_ref (não encontrada)"
                      
                      # Tentar sugerir imagens similares
                      BASENAME=$(basename "$img_ref")
                      SIMILAR=$(find "./gh-pages/relatorio-consolidado/" -name "*${BASENAME}" -o -name "*$(echo "$BASENAME" | sed 's/selenium-screenshot/selenium-screenshot/')*" 2>/dev/null | head -3)
                      if [ -n "$SIMILAR" ]; then
                        echo "          Similares disponíveis:"
                        echo "$SIMILAR" | sed 's|^./gh-pages/relatorio-consolidado/|            |'
                      fi
                    fi
                  fi
                done <<< "$IMAGE_REFS"
                
                echo "    Resumo da validação: $VALID_IMAGES válidas | $INVALID_IMAGES inválidas"
                
                if [ $INVALID_IMAGES -eq 0 ]; then
                  echo "   Todas as imagens estão corretamente referenciadas!"
                fi
              else
                echo "   Nenhuma referência de imagem encontrada neste arquivo"
              fi
            fi
          done
          
          # Mostrar estatísticas finais da ESTRATÉGIA DE PREFIXOS
          echo " Estatísticas finais da nova estrutura (prefixos no relatorio-consolidado):"
          
          # Imagens com prefixos na raiz do consolidado
          CHROME_IMAGES=$(find ./gh-pages/relatorio-consolidado -maxdepth 1 -name "chrome-*.png" -type f 2>/dev/null | wc -l)
          FIREFOX_IMAGES=$(find ./gh-pages/relatorio-consolidado -maxdepth 1 -name "firefox-*.png" -type f 2>/dev/null | wc -l)
          EDGE_IMAGES=$(find ./gh-pages/relatorio-consolidado -maxdepth 1 -name "edge-*.png" -type f 2>/dev/null | wc -l)
          
          echo "   relatorio-consolidado/ (com prefixos):"
          echo "     chrome-*.png: $CHROME_IMAGES imagens"
          echo "     firefox-*.png: $FIREFOX_IMAGES imagens"
          echo "     edge-*.png: $EDGE_IMAGES imagens"
          
          # Imagens nas pastas individuais (cópias para relatórios individuais)
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            BROWSER_IMAGES=$(find "./gh-pages/$FOLDER_NAME" -name "*.png" -type f 2>/dev/null | wc -l)
            echo "   $FOLDER_NAME/: $BROWSER_IMAGES imagens (nomes originais)"
          done
          
          TOTAL_CONSOLIDATED=$(find ./gh-pages/relatorio-consolidado -maxdepth 1 -name "*.png" -type f 2>/dev/null | wc -l)
          echo "   Total no relatorio-consolidado: $TOTAL_CONSOLIDATED imagens (todas com prefixos)"
          echo "   Vantagem: GitHub Pages compatível - imagens co-localizadas com HTMLs"
          
          echo "Verificação de imagens concluída!"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages
