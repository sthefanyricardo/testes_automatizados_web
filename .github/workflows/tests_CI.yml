# 🤖 Pipeline de Testes E2E com Robot Framework + Selenium
# 
# Esta pipeline executa testes automatizados end-to-end em múltiplos navegadores,
# gera relatórios consolidados e publica os resultados no GitHub Pages.
#
# Funcionalidades:
# - ✅ Execução em múltiplos navegadores: Chrome, Firefox e Edge
# - 🐧 Execução em Ubuntu com Robot Framework e Selenium
# - 📊 Relatórios HTML consolidados
# - 🚀 Deploy automático no GitHub Pages

name: E2E Tests - Selenium + Robot Framework
run-name: Testes E2E (${{ github.ref_name }}) - ${{ github.actor }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      browser:
        description: "Em qual navegador os testes devem ser executados?"
        required: false
        default: "todos"
        type: choice
        options:
          - todos
          - chrome
          - firefox
          - edge

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  statuses: write
  checks: write

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "v1"

jobs:
  # Job principal de execução dos testes
  tests:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Matriz simplificada - sempre lowercase, elimina conversão posterior  
        browser: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'todos' && fromJSON(format('["{0}"]', github.event.inputs.browser))) || fromJSON('["chrome", "firefox", "edge"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # ALTERNATIVA MODERNA: Service container para Xvfb (descomente se preferir)
    # services:
    #   xvfb:
    #     image: ghcr.io/browserless/base:latest
    #     options: >-
    #       --tmpfs /tmp:exec,noatime
    #       --shm-size=2gb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Instalar webdriver-manager (versão mais recente compatível)
          pip install "webdriver-manager>=4.0.0,<5.0.0"
          
          # Instalar Selenium (versão LTS estável)
          pip install "selenium>=4.15.0,<5.0.0"
          
          echo "Instalando dependências específicas dos módulos..."
          INSTALLED_MODULES=()
          
          for module in automacao_basico automacao_intermediario automacao_avancado; do
            if [ -f "$module/requirements.txt" ]; then
              echo "Instalando dependências de $module..."
              pip install -r "$module/requirements.txt"
              INSTALLED_MODULES+=("$module")
              echo "Dependências de $module instaladas"
            else
              echo "requirements.txt não encontrado em $module"
            fi
          done
          
          if [ -f "requirements.txt" ]; then
            echo "Instalando dependências globais..."
            pip install -r "requirements.txt"
            echo "Dependências globais instaladas"
          fi
          
          echo "Módulos com dependências instaladas: ${INSTALLED_MODULES[*]}"
          
          # Verificar versões instaladas
          echo "Verificando versões instaladas:"
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"

      # Setup automático do Edge com action oficial
      - name: Setup Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable
        
      - name: Optimize Edge Configuration
        if: matrix.browser == 'edge'
        run: |
          echo "Configurando Edge para melhor performance..."
          EDGE_VERSION=$(microsoft-edge --version 2>/dev/null || edge --version 2>/dev/null)
          echo "Edge instalado: $EDGE_VERSION"
          
          # Pre-download EdgeDriver para evitar timeout durante execução
          echo "Pre-baixando EdgeDriver para evitar timeouts..."
          python -c "
          from selenium import webdriver
          from selenium.webdriver.edge.service import Service
          from webdriver_manager.microsoft import EdgeChromiumDriverManager
          import os
          
          # Configurar timeout mais longo para download do driver
          os.environ['WDM_TIMEOUT'] = '300'  # 5 minutos para download
          
          try:
              driver_path = EdgeChromiumDriverManager().install()
              print(f'EdgeDriver baixado com sucesso: {driver_path}')
          except Exception as e:
              print(f'Erro ao baixar EdgeDriver: {e}')
              print('Continuando com configuração padrão...')
          "
          
          # Teste rápido do Edge
          echo "Testando Edge headless com timeouts otimizados..."
          timeout 30s microsoft-edge --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --version || echo "Edge testado OK"

      - name: Create results directory
        run: |
          mkdir -p ./tests-results-CI/${{ matrix.browser }}
          echo "Diretório de resultados criado: ./tests-results-CI/${{ matrix.browser }}"
          
      - name: Setup Browser Environment
        run: |
          echo "Configurando ambiente para execução..."
          
          # Verificar Robot Framework e bibliotecas instaladas
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          
          # Verificar navegadores disponíveis
          echo "VERIFICAÇÃO DE NAVEGADORES:"
          echo "=========================================="
          
          if command -v google-chrome &> /dev/null; then
            echo "Chrome: $(google-chrome --version)"
          fi
          
          if command -v firefox &> /dev/null; then
            echo "Firefox: $(firefox --version)"
          fi
          
          if command -v microsoft-edge &> /dev/null || command -v edge &> /dev/null; then
            echo "Edge: $(microsoft-edge --version 2>/dev/null || edge --version 2>/dev/null)"
          fi
          
          echo "=========================================="
          
          # Ubuntu runners já têm Xvfb instalado - configurar com resolução expandida
          export DISPLAY=:99
          
          # Configuração padrão do Xvfb para todos os navegadores
          # Usando resolução expandida (1920x1400) para evitar problemas de viewport
          Xvfb :99 -screen 0 1920x1400x24 -ac +extension GLX +render -noreset -nolisten tcp > /dev/null 2>&1 &
          sleep 2
          echo "Display virtual configurado: $DISPLAY (1920x1400 - Padrão para todos os navegadores)"

      - name: Run E2E Tests
        run: |
          echo "Executando testes para o navegador: ${{ matrix.browser }}"
          
          # Browser já vem em lowercase da matriz - sem conversão necessária
          BROWSER="${{ matrix.browser }}"
          
          echo "Navegador configurado: $BROWSER"
          
          # Configurar display para execução headless
          export DISPLAY=:99
          
          # CONFIGURAÇÕES PADRÃO PARA TODOS OS NAVEGADORES
          echo "Aplicando configurações padronizadas para todos os navegadores:"
          echo "  - Window Size: 1920x1200 (resolução padrão expandida)"
          echo "  - Selenium Speed: 0.5s (velocidade equilibrada)"
          echo "  - Implicit Wait: 15s (timeout padrão robusto)"
          echo "  - Page Load Timeout: 45s (timeout de carregamento)"
          echo "  - Screenshot Timeout: 35s (timeout de screenshot)"
          
          # Configurações únicas para todos os navegadores
          WINDOW_SIZE="1920x1200"
          SELENIUM_SPEED="0.5"
          IMPLICIT_WAIT="15" 
          SCROLL_BEHAVIOR="smooth"
          PAGE_LOAD_TIMEOUT="45"
          SCREENSHOT_TIMEOUT="35"
          
          # Configurações específicas apenas para Edge (devido aos timeouts críticos)
          if [ "$BROWSER" = "edge" ]; then
            echo "Edge: Aplicando apenas timeouts estendidos devido à lentidão conhecida"
            SELENIUM_SPEED="1.0"
            IMPLICIT_WAIT="25"
            PAGE_LOAD_TIMEOUT="60"
            SCREENSHOT_TIMEOUT="50"
          fi
          
          # Configurações específicas do Edge para melhor performance
          if [[ "${{ matrix.browser }}" == "edge" ]]; then
            export EDGE_OPTIONS="--disable-web-security --disable-features=VizDisplayCompositor --disable-extensions --disable-gpu --no-sandbox --disable-dev-shm-usage --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows --disable-background-networking"
            echo "Edge: Aplicando argumentos otimizados para performance"
            echo "  - Edge options: $EDGE_OPTIONS"
          fi
          
          echo "Configurações aplicadas:"
          echo "  - Screenshot timeout: ${SCREENSHOT_TIMEOUT}s"
          echo "  - Window size: $WINDOW_SIZE"
          echo "  - Selenium speed: $SELENIUM_SPEED"
          echo "  - Implicit wait: ${IMPLICIT_WAIT}s"
          echo "  - Page load timeout: ${PAGE_LOAD_TIMEOUT}s"
          echo "  - Scroll behavior: $SCROLL_BEHAVIOR"
          
          # Executar Robot Framework com configurações específicas por navegador
          set +e
          
          robot \
            --name "Tests E2E - Robot Framework CI (${{ matrix.browser }})" \
            --outputdir ./tests-results-CI/${{ matrix.browser }} \
            --variable BROWSER:$BROWSER \
            --variable HEADLESS:true \
            --variable TIMEOUT:${SCREENSHOT_TIMEOUT} \
            --variable WINDOW_SIZE:$WINDOW_SIZE \
            --variable FORCE_WINDOW_SIZE:true \
            --variable SET_WINDOW_SIZE:1920x1200 \
            --variable MAXIMIZE_BROWSER_WINDOW:false \
            --variable SELENIUM_SPEED:$SELENIUM_SPEED \
            --variable CAPTURE_PAGE_SCREENSHOT_ON_FAILURE:true \
            --variable BROWSER_PREFIX:${{ matrix.browser }} \
            --variable SCREENSHOT_TIMEOUT:${SCREENSHOT_TIMEOUT} \
            --variable IMPLICIT_WAIT:$IMPLICIT_WAIT \
            --variable PAGE_LOAD_TIMEOUT:$PAGE_LOAD_TIMEOUT \
            --variable SCROLL_BEHAVIOR:$SCROLL_BEHAVIOR \
            --variable SCROLL_INTO_VIEW:true \
            --variable SCROLL_ELEMENT_INTO_VIEW:true \
            --variable AUTO_SCROLL_BEHAVIOR:always \
            --variable VIEWPORT_FIX:true \
            --variable EDGE_OPTIONS:"${EDGE_OPTIONS:-}" \
            --loglevel INFO \
            --reporttitle "Relatório E2E - ${{ matrix.browser }}" \
            --name "Relatório E2E - ${{ matrix.browser }}" \
            --maxerrorlines 10 \
            --include "*" \
            automacao_basico/tests automacao_intermediario/tests automacao_avancado/tests
          
          ROBOT_EXIT_CODE=$?
          echo "Robot Framework finalizado com código: $ROBOT_EXIT_CODE"
          
          if [ $ROBOT_EXIT_CODE -eq 0 ]; then
            echo "PERFEITO! Todos os testes passaram!"
            exit 0
          elif [ $ROBOT_EXIT_CODE -le 250 ]; then
            echo "Alguns testes falharam, mas a execução foi bem-sucedida"
            echo "Relatórios gerados com sucesso para análise"
            exit 0
          else
            echo "Erro crítico na execução dos testes"
            exit 1
          fi

      - name: Organize Screenshots and Evidence
        if: always()
        run: |
          echo "Organizando evidências e screenshots gerados..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          BROWSER="${{ matrix.browser }}"  # Já vem em lowercase da matriz
          SCREENSHOTS_DIR="$RESULTS_DIR/screenshots_$BROWSER"
          
          echo "Configuração:"
          echo "  Browser: $BROWSER"
          echo "  Diretório de resultados: $RESULTS_DIR"
          echo "  Diretório de screenshots: $SCREENSHOTS_DIR"
          
          # Criar diretório de screenshots se não existir
          mkdir -p "$SCREENSHOTS_DIR"
          
          # Mover todos os PNGs soltos para o diretório de screenshots organizado
          MOVED_COUNT=0
          if find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
            echo "Organizando screenshots soltos do diretório principal..."
            find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | while read png_file; do
              mv "$png_file" "$SCREENSHOTS_DIR/"
              echo "  Movido: $(basename "$png_file") → screenshots_$BROWSER/"
            done
            MOVED_COUNT=$(find "$SCREENSHOTS_DIR" -name "*.png" -type f 2>/dev/null | wc -l)
          fi
          
          # Verificar screenshots em outros possíveis locais do Robot Framework
          for possible_dir in "$RESULTS_DIR"/*screenshots* "$RESULTS_DIR"/selenium-screenshot-* "$RESULTS_DIR"/robot-screenshot-*; do
            if [ -d "$possible_dir" ] && [ "$possible_dir" != "$SCREENSHOTS_DIR" ]; then
              if find "$possible_dir" -name "*.png" -type f | grep -q .; then
                echo "Consolidando screenshots de: $possible_dir"
                find "$possible_dir" -name "*.png" -type f -exec mv {} "$SCREENSHOTS_DIR/" \;
              fi
            fi
          done
          
          # Contar screenshots finais
          FINAL_COUNT=$(find "$SCREENSHOTS_DIR" -name "*.png" -type f 2>/dev/null | wc -l)
          
          echo "Resumo da organização:"
          echo "  Screenshots organizados: $FINAL_COUNT"
          echo "  Localização final: $SCREENSHOTS_DIR"
          
          if [ $FINAL_COUNT -gt 0 ]; then
            echo "  Exemplos organizados:"
            find "$SCREENSHOTS_DIR" -name "*.png" -type f | head -5 | while read img; do
              echo "    - $(basename "$img")"
            done
          else
            echo "  Aviso: Nenhum screenshot encontrado para organizar"
            # Criar pelo menos um arquivo de evidência para manter a estrutura
            touch "$SCREENSHOTS_DIR/no_screenshots_generated.txt"
            echo "Nenhum screenshot foi gerado durante os testes." > "$SCREENSHOTS_DIR/no_screenshots_generated.txt"
          fi
          
          # Debug: Estrutura final
          echo "Estrutura final do diretório de resultados:"
          find "$RESULTS_DIR" -type f | head -10 | while read file; do
            echo "  $file"
          done
        continue-on-error: true

      - name: Check Test Results
        if: always()
        run: |
          echo "Verificando resultados dos testes para ${{ matrix.browser }}..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          if [ -f "$RESULTS_DIR/output.xml" ]; then
            echo "Arquivo output.xml encontrado!"
            echo "Conteúdo do diretório de resultados:"
            ls -la "$RESULTS_DIR/"
            
            echo "Arquivos de relatório gerados:"
            [ -f "$RESULTS_DIR/report.html" ] && echo "  report.html ($(stat -c%s "$RESULTS_DIR/report.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/log.html" ] && echo "  log.html ($(stat -c%s "$RESULTS_DIR/log.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/output.xml" ] && echo "  output.xml ($(stat -c%s "$RESULTS_DIR/output.xml" 2>/dev/null || echo "?") bytes)"
          else
            echo "Arquivo output.xml não encontrado!"
            echo "Conteúdo disponível no diretório:"
            ls -la "$RESULTS_DIR/" 2>/dev/null || echo "Diretório de resultados não existe"
          fi

      - name: Debug Upload Paths
        run: |
          echo "DEBUG - Verificando o que será incluído no upload:"
          BASE_PATH="tests-results-CI/${{ matrix.browser }}"
          
          echo "Arquivos essenciais:"
          [ -f "$BASE_PATH/output.xml" ] && echo "  output.xml ($(stat -c%s "$BASE_PATH/output.xml" 2>/dev/null || echo "?") bytes)" || echo "  output.xml não encontrado"
          [ -f "$BASE_PATH/report.html" ] && echo "  report.html ($(stat -c%s "$BASE_PATH/report.html" 2>/dev/null || echo "?") bytes)" || echo "  report.html não encontrado"
          [ -f "$BASE_PATH/log.html" ] && echo "  log.html ($(stat -c%s "$BASE_PATH/log.html" 2>/dev/null || echo "?") bytes)" || echo "  log.html não encontrado"
          
          echo "Screenshots no diretório principal:"
          find $BASE_PATH -maxdepth 1 -name "*.png" 2>/dev/null | head -5 | while read f; do echo "  $f"; done || echo "  Nenhum PNG no diretório principal"
          
          echo "Screenshots em subdiretórios screenshots_*:"
          find $BASE_PATH -path "*/screenshots_*/*.png" 2>/dev/null | head -10 | while read f; do echo "  $f"; done || echo "  Nenhum PNG em subdiretórios screenshots_*"
          
          echo "Todos os subdiretórios screenshots_*:"
          find $BASE_PATH -type d -name "screenshots_*" 2>/dev/null | while read d; do 
            echo "  $d ($(find "$d" -name "*.png" 2>/dev/null | wc -l) PNGs)"
          done || echo "  Nenhum subdiretório screenshots_* encontrado"
          
          echo "Simulando padrões de upload:"
          echo "Pattern: $BASE_PATH/*.png"
          find $BASE_PATH -maxdepth 1 -name "*.png" 2>/dev/null | wc -l | xargs echo "  Matches:"
          echo "Pattern: $BASE_PATH/screenshots_*/"
          find $BASE_PATH -type d -name "screenshots_*" 2>/dev/null | wc -l | xargs echo "  Directories:"
        continue-on-error: true

      - name: Upload Test Results and Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests-results-CI/${{ matrix.browser }}/output.xml
            tests-results-CI/${{ matrix.browser }}/report.html
            tests-results-CI/${{ matrix.browser }}/log.html
            tests-results-CI/${{ matrix.browser }}/screenshots_${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn

  # Job para consolidar resultados e publicar no GitHub Pages
  publish-results:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: ./all-results

      - name: Debug Downloaded Artifacts
        run: |
          echo "Verificando artifacts baixados:"
          if [ -d "./all-results" ]; then
            find ./all-results -type f | head -20 | while read f; do
              echo "  $f"
            done
            
            echo "Resumo por browser:"
            for browser_dir in ./all-results/test-results-*; do
              if [ -d "$browser_dir" ]; then
                browser=$(basename "$browser_dir" | sed 's/test-results-//')
                echo "  Browser: $browser"
                echo "    Output.xml: $([ -f "$browser_dir/output.xml" ] && echo "✓" || echo "✗")"
                echo "    Report.html: $([ -f "$browser_dir/report.html" ] && echo "✓" || echo "✗")"
                echo "    Log.html: $([ -f "$browser_dir/log.html" ] && echo "✓" || echo "✗")"
                
                # Contar screenshots
                screenshot_count=0
                if find "$browser_dir" -name "*.png" -type f | grep -q .; then
                  screenshot_count=$(find "$browser_dir" -name "*.png" -type f | wc -l)
                fi
                echo "    Screenshots: $screenshot_count"
                
                # Mostrar estrutura de diretórios
                if find "$browser_dir" -type d | grep -v "^$browser_dir$" | head -3 | grep -q .; then
                  echo "    Subdiretórios:"
                  find "$browser_dir" -type d | grep -v "^$browser_dir$" | head -3 | while read subdir; do
                    echo "      $(basename "$subdir")"
                  done
                fi
              fi
            done
          else
            echo "  Diretório ./all-results não encontrado!"
          fi
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Initialize GitHub Pages structure
        run: |
          echo "Inicializando estrutura otimizada do GitHub Pages..."
          mkdir -p ./gh-pages
          mkdir -p ./gh-pages/relatorio-consolidado
          
          echo "✅ Resumo da organização final para os arquivos de imagens/screenshots:"
          echo "- Cada imagem existe apenas 2x: consolidado + individual"
          echo "- Estrutura screenshots_* preservada em todos os relatórios"
          echo "- Assets organizados sem redundância!"
          echo "- Zero imagens soltas no diretório raiz"
          echo "- Máxima eficiência de armazenamento"
          echo "- GitHub Pages totalmente compatível"
        continue-on-error: true

      - name: Create consolidated report with rebot
        run: |
          OUTPUT_FILES=$(find ./all-results -name "output.xml" -type f 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$OUTPUT_FILES" ]; then
            echo "Nenhum arquivo output.xml encontrado. Criando página de status..."
            cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Relatório E2E - Status</title>
            <meta charset="utf-8">
          </head>
          <body>
            <h1>Pipeline em Execução</h1>
            <p>Os testes estão sendo executados. Os relatórios serão disponibilizados em breve.</p>
          </body>
          </html>
          EOF
          else
            echo "Arquivos output.xml encontrados - gerando relatório consolidado..."
            
            # ESTRATÉGIA OTIMIZADA: Organizar imagens DIRETAMENTE nas pastas screenshots_* finais
            echo "ESTRATÉGIA OTIMIZADA: Organização direta em estrutura screenshots_*..."
            mkdir -p ./gh-pages/relatorio-consolidado
            
            # Criar pastas screenshots_* no destino final (nomenclatura lowercase)
            for browser in chrome firefox edge; do
              mkdir -p "./gh-pages/relatorio-consolidado/screenshots_$browser"
              echo "Criado diretório: ./gh-pages/relatorio-consolidado/screenshots_$browser"
            done
            
            TOTAL_ORGANIZED=0
            # Os artifacts agora vêm com nomes em lowercase: chrome, firefox, edge
            for browser in chrome firefox edge; do
              BROWSER_DIR="./all-results/test-results-$browser"
              DEST_SCREENSHOTS="./gh-pages/relatorio-consolidado/screenshots_$browser"
              
              echo "Processando browser: $browser"
              echo "  Procurando em: $BROWSER_DIR"
              echo "  Destino: $DEST_SCREENSHOTS"
              
              if [ -d "$BROWSER_DIR" ]; then
                PNG_COUNT=0
                
                # Debug: Verificar estrutura do artifact baixado
                echo "  Estrutura do artifact:"
                find "$BROWSER_DIR" -type f | head -5 | while read f; do
                  echo "    $f"
                done
                
                # Copiar imagens do diretório screenshots_browser organizado
                SCREENSHOTS_SRC="$BROWSER_DIR/screenshots_$browser"
                if [ -d "$SCREENSHOTS_SRC" ] && find "$SCREENSHOTS_SRC" -name "*.png" -type f | grep -q .; then
                  SCREENSHOTS_COUNT=$(find "$SCREENSHOTS_SRC" -name "*.png" -type f | wc -l)
                  find "$SCREENSHOTS_SRC" -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                  PNG_COUNT=$((PNG_COUNT + SCREENSHOTS_COUNT))
                  echo "  $SCREENSHOTS_COUNT imagens de screenshots_$browser → screenshots_$browser/"
                fi
                
                # Fallback: Copiar qualquer PNG solto no diretório principal
                if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                  MAIN_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                  find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                  PNG_COUNT=$((PNG_COUNT + MAIN_COUNT))
                  echo "  $MAIN_COUNT imagens soltas do diretório principal → screenshots_$browser/"
                fi
                
                # Copiar outros possíveis diretórios de screenshots
                find "$BROWSER_DIR" -type d -name "screenshots_*" | while read screenshot_dir; do
                  if [ -d "$screenshot_dir" ] && [ "$screenshot_dir" != "$SCREENSHOTS_SRC" ]; then
                    if find "$screenshot_dir" -name "*.png" -type f | grep -q .; then
                      SUBDIR_COUNT=$(find "$screenshot_dir" -name "*.png" -type f | wc -l)
                      find "$screenshot_dir" -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                      echo "  $SUBDIR_COUNT imagens de $(basename "$screenshot_dir") → screenshots_$browser/"
                    fi
                  fi
                done
                
                # Atualizar contadores
                FINAL_COUNT=$(find "$DEST_SCREENSHOTS" -name "*.png" -type f 2>/dev/null | wc -l)
                TOTAL_ORGANIZED=$((TOTAL_ORGANIZED + FINAL_COUNT))
                echo "  $browser: $FINAL_COUNT imagens organizadas no total"
              else
                echo "  Diretório $BROWSER_DIR não encontrado"
              fi
            done
            
            echo "Total de imagens organizadas: $TOTAL_ORGANIZED"
            echo "Estrutura final: screenshots_chrome/, screenshots_firefox/, screenshots_edge/"
            echo "ZERO duplicação - cada imagem em apenas UM local"
            
            # Para rebot, criar links simbólicos temporários das imagens para o diretório de execução
            echo "Criando links temporários para execução do rebot..."
            for browser in chrome firefox edge; do
              SRC_DIR="./gh-pages/relatorio-consolidado/screenshots_$browser"
              if [ -d "$SRC_DIR" ] && find "$SRC_DIR" -name "*.png" -type f | grep -q .; then
                echo "  Criando links para screenshots_$browser ($(find "$SRC_DIR" -name "*.png" -type f | wc -l) imagens)"
                find "$SRC_DIR" -name "*.png" -type f -exec ln -sf "../relatorio-consolidado/screenshots_$browser/{}" "./gh-pages/{}" \; 2>/dev/null || \
                find "$SRC_DIR" -name "*.png" -type f -exec cp {} "./gh-pages/" \;
              fi
            done
            
            cd ./gh-pages
            python -m robot.rebot \
              --output output.xml \
              --log log.html \
              --report report.html \
              --reporttitle "Relatório Consolidado E2E" \
              --name "Relatório Consolidado E2E" \
              ../all-results/*/output.xml || true
            
            # Remover links temporários após rebot para evitar duplicação
            echo "Removendo links temporários para evitar duplicação..."
            find . -maxdepth 1 -name "*.png" -type f -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.png" -type l -delete 2>/dev/null || true
            cd ..

            REBOT_EXIT_CODE=$?
            echo "Robot.rebot finalizado com código: $REBOT_EXIT_CODE"
            
            if [ $REBOT_EXIT_CODE -eq 0 ]; then
              echo "Relatório consolidado gerado com sucesso - todos os testes passaram!"
            elif [ $REBOT_EXIT_CODE -le 250 ]; then
              echo "Relatório consolidado gerado com alguns testes falhando (código $REBOT_EXIT_CODE)"
              echo "Relatório disponível para análise das falhas"
            else
              echo "Erro na geração do relatório (código $REBOT_EXIT_CODE)"
            fi

            echo "Relatório consolidado gerado com organização otimizada!"
          fi
        continue-on-error: true

      - name: Copy additional assets and fix image paths
        run: |
          echo "Organizando assets finais sem duplicação..."
          
          # Criar estrutura de pastas para relatórios individuais (lowercase)
          for browser in chrome firefox edge; do
            mkdir -p "./gh-pages/execucao-$browser"
            echo "Criado diretório: ./gh-pages/execucao-$browser"
          done
          
          # Mover arquivos consolidados para pasta dedicada (já organizados no step anterior)
          echo "Organizando relatórios consolidados..."
          if [ -f "./gh-pages/report.html" ]; then
            mv "./gh-pages/report.html" "./gh-pages/relatorio-consolidado/"
            echo "   report.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/log.html" ]; then
            mv "./gh-pages/log.html" "./gh-pages/relatorio-consolidado/"
            echo "   log.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/output.xml" ]; then
            mv "./gh-pages/output.xml" "./gh-pages/relatorio-consolidado/"
            echo "   output.xml → relatorio-consolidado/"
          fi
          
          # IMPORTANTE: Imagens JÁ estão organizadas em screenshots_* pelo step anterior
          echo "Imagens já organizadas em estrutura screenshots_* sem duplicação"
          
          # Verificar estrutura de imagens consolidadas (já criada)
          echo "Verificando estrutura de imagens consolidadas:"
          for browser in chrome firefox edge; do
            SCREENSHOTS_DIR="./gh-pages/relatorio-consolidado/screenshots_$browser"
            if [ -d "$SCREENSHOTS_DIR" ]; then
              IMG_COUNT=$(find "$SCREENSHOTS_DIR" -name "*.png" -type f | wc -l)
              echo "   screenshots_$browser/: $IMG_COUNT imagens"
            fi
          done
          
          # Organizar relatórios individuais por navegador (nomenclatura corrigida)
          echo "Organizando relatórios individuais por navegador..."
          for browser in chrome firefox edge; do
            BROWSER_DIR="./all-results/test-results-$browser"
            FOLDER_NAME="execucao-$browser"
            
            if [ -d "$BROWSER_DIR" ]; then
              echo "  Processando $browser ($BROWSER_DIR → $FOLDER_NAME)..."
              
              # Copiar arquivos HTML/XML individuais
              if [ -f "$BROWSER_DIR/report.html" ]; then
                cp "$BROWSER_DIR/report.html" "./gh-pages/$FOLDER_NAME/"
                echo "    ✓ report.html copiado"
              fi
              
              if [ -f "$BROWSER_DIR/log.html" ]; then
                cp "$BROWSER_DIR/log.html" "./gh-pages/$FOLDER_NAME/"
                echo "    ✓ log.html copiado"
              fi
              
              if [ -f "$BROWSER_DIR/output.xml" ]; then
                cp "$BROWSER_DIR/output.xml" "./gh-pages/$FOLDER_NAME/"
                echo "    ✓ output.xml copiado"
              fi
              
              # Criar estrutura screenshots_* para relatórios individuais
              mkdir -p "./gh-pages/$FOLDER_NAME/screenshots_$browser"
              
              INDIVIDUAL_COUNT=0
              
              # Copiar imagens das pastas screenshots_* organizadas
              SCREENSHOTS_SRC="$BROWSER_DIR/screenshots_$browser"
              if [ -d "$SCREENSHOTS_SRC" ] && find "$SCREENSHOTS_SRC" -name "*.png" -type f | grep -q .; then
                SCREENSHOTS_COUNT=$(find "$SCREENSHOTS_SRC" -name "*.png" -type f | wc -l)
                find "$SCREENSHOTS_SRC" -name "*.png" -type f -exec cp {} "./gh-pages/$FOLDER_NAME/screenshots_$browser/" \;
                INDIVIDUAL_COUNT=$((INDIVIDUAL_COUNT + SCREENSHOTS_COUNT))
                echo "    ✓ $SCREENSHOTS_COUNT imagens copiadas para screenshots_$browser/"
              fi
              
              # Fallback: Copiar qualquer PNG solto no diretório principal
              if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                MAIN_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "./gh-pages/$FOLDER_NAME/screenshots_$browser/" \;
                INDIVIDUAL_COUNT=$((INDIVIDUAL_COUNT + MAIN_COUNT))
                echo "    ✓ $MAIN_COUNT imagens soltas copiadas para screenshots_$browser/"
                INDIVIDUAL_COUNT=$((INDIVIDUAL_COUNT + MAIN_COUNT))
              fi
              
              FINAL_COUNT=$(find "./gh-pages/$FOLDER_NAME/screenshots_$BROWSER_LOWERCASE" -name "*.png" -type f | wc -l)
              echo "    Total individual para $browser: $FINAL_COUNT imagens em screenshots_$BROWSER_LOWERCASE/"
            fi
          done
          
          # Corrigir caminhos das imagens nos arquivos HTML (estrutura screenshots_*)
          
          echo "Corrigindo caminhos das imagens nos arquivos HTML para usar estrutura screenshots_*..."
          
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   Corrigindo $(basename "$html_file")..."
              
              # Primeiro, deixar os caminhos simples (sem path)
              sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
              
              # Mapear imagens para as pastas screenshots_* corretas
              echo "      Mapeando referências para pastas screenshots_*..."
              
              # Extrair todas as referências de imagens PNG
              SCREENSHOT_REFS=$(grep -oP '(src|href)="(\.\/)?[^"]*\.png"' "$html_file" 2>/dev/null | \
                               sed 's/src="//; s/href="//; s/\.\///; s/"//' | sort | uniq)
              
              if [ -n "$SCREENSHOT_REFS" ]; then
                MAPPED_COUNT=0
                UNMAPPED_COUNT=0
                
                while IFS= read -r screenshot; do
                  if [ -n "$screenshot" ]; then
                    # Procurar a imagem nas pastas screenshots_*
                    FOUND_IN=""
                    for screenshots_folder in $(find "./gh-pages/relatorio-consolidado" -type d -name "screenshots_*" | sort); do
                      if [ -f "$screenshots_folder/$screenshot" ]; then
                        FOUND_IN=$(basename "$screenshots_folder")
                        break
                      fi
                    done
                    
                    # Se não encontrou nas pastas screenshots_*, verificar se está no diretório principal
                    if [ -z "$FOUND_IN" ] && [ -f "./gh-pages/relatorio-consolidado/$screenshot" ]; then
                      # Imagem está no diretório principal, deixar como está
                      FOUND_IN="main"
                    fi
                    
                    if [ -n "$FOUND_IN" ] && [ "$FOUND_IN" != "main" ]; then
                      # Substituir referência para incluir pasta screenshots_*
                      sed -i "s|src=\"$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|src=\"\./$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|href=\"$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|href=\"\./$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      
                      MAPPED_COUNT=$((MAPPED_COUNT + 1))
                    elif [ "$FOUND_IN" = "main" ]; then
                      # Imagem no diretório principal, não precisa alterar
                      MAPPED_COUNT=$((MAPPED_COUNT + 1))
                    else
                      UNMAPPED_COUNT=$((UNMAPPED_COUNT + 1))
                    fi
                  fi
                done <<< "$SCREENSHOT_REFS"
                
                echo "      Mapeadas: $MAPPED_COUNT | Não encontradas: $UNMAPPED_COUNT"
              else
                echo "      Nenhuma referência de selenium-screenshot encontrada"
              fi
              
              # Verificar resultado final
              FINAL_REFS=$(grep -c '\.png' "$html_file" 2>/dev/null || echo "0")
              echo "      Total de referências processadas: $FINAL_REFS"
            fi
          done
          
          # Corrigir relatórios individuais (com estrutura screenshots_*)
          
          echo "Corrigindo caminhos nos relatórios individuais..."
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            
            for html_file in ./gh-pages/$FOLDER_NAME/*.html; do
              if [ -f "$html_file" ]; then
                echo "  Corrigindo $(basename "$html_file") para $browser..."
                
                # Primeiro, normalizar caminhos
                sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
                sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
                
                # Mapear imagens para pastas screenshots_* se existirem
                SCREENSHOT_REFS=$(grep -oP '(src|href)="(\.\/)?[^"]*\.png"' "$html_file" 2>/dev/null | \
                                 sed 's/src="//; s/href="//; s/\.\///; s/"//' | sort | uniq)
                
                if [ -n "$SCREENSHOT_REFS" ]; then
                  while IFS= read -r screenshot; do
                    if [ -n "$screenshot" ]; then
                      # Procurar nas pastas screenshots_* deste navegador
                      FOUND_IN=""
                      for screenshots_folder in $(find "./gh-pages/$FOLDER_NAME" -type d -name "screenshots_*" 2>/dev/null | sort); do
                        if [ -f "$screenshots_folder/$screenshot" ]; then
                          FOUND_IN=$(basename "$screenshots_folder")
                          break
                        fi
                      done
                      
                      if [ -n "$FOUND_IN" ]; then
                        # Atualizar referência para incluir pasta screenshots_*
                        sed -i "s|src=\"$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|src=\"\./$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|href=\"$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|href=\"\./$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      fi
                    fi
                  done <<< "$SCREENSHOT_REFS"
                fi
              fi
            done
          done
          
          # Resumo da estrutura otimizada
          echo "📋 Estrutura dos diretórios e os seus respectivos arquivos/conteúdos:"
          echo "  📂 relatorio-consolidado/"
          echo "    ├── report.html, log.html, output.xml"
          echo "    ├── 📂 screenshots_chrome/ (imagens Chrome únicas)"
          echo "    ├── 📂 screenshots_firefox/ (imagens Firefox únicas)"
          echo "    └── 📂 screenshots_edge/ (imagens Edge únicas)"
          echo "  📂 execucao-chrome/"
          echo "    ├── report.html, log.html, output.xml"
          echo "    └── 📂 screenshots_chrome/ (cópia para visualização individual)"
          echo "  📂 execucao-firefox/ e execucao-edge/ (estrutura similar)"
          
          echo "✅ Resumo da organização final para os arquivos de imagens/screenshots:"
          echo "- Cada imagem existe apenas 2x: consolidado + individual"
          echo "- Estrutura screenshots_* preservada em todos os relatórios"
          echo "- Assets organizados sem redundância!"
        continue-on-error: true

