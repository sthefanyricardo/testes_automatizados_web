          EOF
          
          echo "Página principal criada: index.html (estrutura organizada)"
          
          # Verificação final SIMPLIFICADA dos caminhos de imagem no consolidado
          echo "Verificação final dos caminhos de imagem no consolidado..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   Processando $(basename "$html_file")..."
              
              # Debug: mostrar exemplos de referências ANTES da correção
              echo "     Exemplos de referências ANTES da correção:"
              grep -o 'src="[^"]*\.png"' "$html_file" | head -3 | sed 's/^/      /' || echo "      Nenhuma referência PNG encontrada"
              
              # Correção SIMPLES: Robot Framework gera "selenium-screenshot-X.png" e as imagens já estão na pasta
              echo "     Aplicando correção simples de caminhos..."
              
              # Corrigir caminhos absolutos para relativos
              sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
              
              # Debug: mostrar exemplos APÓS a correção
              echo "     Exemplos de referências APÓS a correção:"
              grep -o 'src="[^"]*\.png"' "$html_file" | head -3 | sed 's/^/      /' || echo "      Nenhuma referência PNG encontrada"
              
              # Verificar se ainda há caminhos problemáticos
              PROBLEM_PATHS=$(grep -c 'src="[^"]*\/[^"]*\.png"' "$html_file" 2>/dev/null || echo "0")
              if [ "$PROBLEM_PATHS" -eq 0 ]; then
                echo "     Todos os caminhos corrigidos em $(basename "$html_file")"
              else
                echo "     Ainda há $PROBLEM_PATHS caminhos com subdiretórios"
              fi
            fi
          done
          
          # Validação final: verificar se as imagens estão acessíveis
          echo " Validação final: verificando se imagens estão acessíveis..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   Validando imagens em $(basename "$html_file"):"
              
              # Extrair todas as referências de imagem
              IMAGE_REFS=$(grep -o 'src="[^"]*\.png"' "$html_file" 2>/dev/null | sed 's/src="//;s/"//' | sort | uniq)
              
              if [ -n "$IMAGE_REFS" ]; then
                VALID_IMAGES=0
                INVALID_IMAGES=0
                
                echo "     Referências encontradas:"
                while IFS= read -r img_ref; do
                  if [ -n "$img_ref" ]; then
                    # Construir caminho completo
                    if [[ "$img_ref" == "./"* ]]; then
                      FULL_PATH="./gh-pages/relatorio-consolidado/${img_ref#./}"
                    else
                      FULL_PATH="./gh-pages/relatorio-consolidado/$img_ref"
                    fi
                    
                    if [ -f "$FULL_PATH" ]; then
                      VALID_IMAGES=$((VALID_IMAGES + 1))
                      echo "      $img_ref"
                    else
                      INVALID_IMAGES=$((INVALID_IMAGES + 1))
                      echo "       $img_ref (não encontrada)"
                      
                      # Tentar sugerir imagens similares
                      BASENAME=$(basename "$img_ref")
                      SIMILAR=$(find "./gh-pages/relatorio-consolidado/" -name "*${BASENAME}" -o -name "*$(echo "$BASENAME" | sed 's/selenium-screenshot/selenium-screenshot/')*" 2>/dev/null | head -3)
                      if [ -n "$SIMILAR" ]; then
                        echo "          Similares disponíveis:"
                        echo "$SIMILAR" | sed 's|^./gh-pages/relatorio-consolidado/|            |'
                      fi
                    fi
                  fi
                done <<< "$IMAGE_REFS"
                
                echo "    Resumo da validação: $VALID_IMAGES válidas | $INVALID_IMAGES inválidas"
                
                if [ $INVALID_IMAGES -eq 0 ]; then
                  echo "   Todas as imagens estão corretamente referenciadas!"
                fi
              else
                echo "   Nenhuma referência de imagem encontrada neste arquivo"
              fi
            fi
          done
          
          # Mostrar estatísticas finais da ESTRATÉGIA DE SUBPASTAS
          echo "✨ Estatísticas finais da estrutura elegante (subpastas no relatorio-consolidado):"
          
          # Imagens organizadas em subpastas do consolidado
          CHROME_IMAGES=$(find ./gh-pages/relatorio-consolidado/chrome -name "*.png" -type f 2>/dev/null | wc -l)
          FIREFOX_IMAGES=$(find ./gh-pages/relatorio-consolidado/firefox -name "*.png" -type f 2>/dev/null | wc -l)
          EDGE_IMAGES=$(find ./gh-pages/relatorio-consolidado/edge -name "*.png" -type f 2>/dev/null | wc -l)
          
          echo "   📂 relatorio-consolidado/ (organizado em subpastas):"
          echo "     chrome/: $CHROME_IMAGES imagens"
          echo "     firefox/: $FIREFOX_IMAGES imagens"
          echo "     edge/: $EDGE_IMAGES imagens"
          
          # Imagens nas pastas individuais (cópias para relatórios individuais)
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            BROWSER_IMAGES=$(find "./gh-pages/$FOLDER_NAME" -name "*.png" -type f 2>/dev/null | wc -l)
            echo "   📂 $FOLDER_NAME/: $BROWSER_IMAGES imagens (nomes originais preservados)"
          done
          
          TOTAL_CONSOLIDATED=$((CHROME_IMAGES + FIREFOX_IMAGES + EDGE_IMAGES))
          echo "   🎯 Total no relatorio-consolidado: $TOTAL_CONSOLIDATED imagens (organizadas em subpastas)"
          echo "   ✅ Vantagem: Estrutura elegante e GitHub Pages compatível"
          
          echo "Verificação de imagens concluída!"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages
