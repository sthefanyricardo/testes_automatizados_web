# 🤖 Pipeline de Testes E2E com Robot Framework + Selenium
# 
# Esta pipeline executa testes automatizados end-to-end em múltiplos navegadores,
# gera relatórios consolidados e publica os resultados no GitHub Pages.
#
# Funcionalidades:
# - ✅ Execução em múltiplos navegadores: Chrome, Firefox e Edge
# - 🐧 Execução em Ubuntu com Robot Framework e Selenium
# - 📊 Relatórios HTML consolidados
# - 🚀 Deploy automático no GitHub Pages

name: E2E Tests - Selenium + Robot Framework
run-name: Testes E2E (${{ github.ref_name }}) - ${{ github.actor }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      browser:
        description: "Em qual navegador os testes devem ser executados?"
        required: false
        default: "todos"
        type: choice
        options:
          - todos
          - chrome
          - firefox
          - edge

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  statuses: write
  checks: write

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "v1"

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Simplificação: usa lowercase direto e sintaxe ternária mais clara
        browser: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'todos' && fromJSON(format('["{0}"]', github.event.inputs.browser))) || fromJSON('["chrome", "firefox", "edge"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Instalar versões mais recentes e estáveis para melhor compatibilidade
          pip install webdriver-manager selenium robotframework robotframework-seleniumlibrary
          
          echo "Instalando dependências específicas dos módulos..."
          INSTALLED_MODULES=()
          
          for module in automacao_basico automacao_intermediario automacao_avancado; do
            if [ -f "$module/requirements.txt" ]; then
              echo "Instalando dependências de $module..."
              pip install -r "$module/requirements.txt"
              INSTALLED_MODULES+=("$module")
              echo "Dependências de $module instaladas"
            else
              echo "requirements.txt não encontrado em $module"
            fi
          done
          
          if [ -f "requirements.txt" ]; then
            echo "Instalando dependências globais..."
            pip install -r "requirements.txt"
            echo "Dependências globais instaladas"
          fi
          
          echo "Módulos com dependências instaladas: ${INSTALLED_MODULES[*]}"
          
          # Verificar versões instaladas
          echo "Verificando versões instaladas:"
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"

      # 🚀 Setup otimizado do Edge apenas quando necessário
      - name: Setup Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable

      - name: Create results directory
        run: |
          mkdir -p ./tests-results-CI/${{ matrix.browser }}
          echo "Diretório de resultados criado: ./tests-results-CI/${{ matrix.browser }}"
          
      # 🚀 Configuração otimizada usando recursos nativos do Ubuntu Runner
      - name: Setup Browser Environment
        run: |
          echo "🚀 Configurando ambiente otimizado..."
          
          # Ubuntu runners já têm Xvfb disponível - usar diretamente
          export DISPLAY=:99
          # Usar Xvfb nativo do runner (mais rápido que apt install)
          nohup Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 2
          
          # 🔧 Configurações específicas para Firefox
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            echo "🦊 Aplicando configurações específicas para Firefox..."
            # Configurar perfil do Firefox para estabilidade
            export MOZ_HEADLESS=1
            export MOZ_DISABLE_CONTENT_SANDBOX=1
            # Desabilitar hardware acceleration para evitar problemas de rendering
            export MOZ_DISABLE_GPU_SANDBOX=1
          fi
          
          echo "✅ Display virtual ativo: $DISPLAY"
          echo "✅ Navegador configurado: ${{ matrix.browser }}"
          
          # Verificação rápida de dependências essenciais
          robot --version
          python -c "import selenium; print(f'Selenium: {selenium.__version__}')"

      - name: Debug and Verify Environment
        run: |
          echo "🔍 Verificando estrutura do projeto e diretórios de teste..."
          
          echo "📂 Estrutura atual do workspace:"
          ls -la
          
          echo ""
          echo "🔍 Verificando diretórios de teste específicos:"
          for test_dir in automacao_basico/tests automacao_intermediario/tests automacao_avancado/tests; do
            if [ -d "$test_dir" ]; then
              echo "  ✅ $test_dir existe"
              echo "     Arquivos: $(find "$test_dir" -name "*.robot" -o -name "*.resource" | wc -l) arquivos .robot/.resource"
              ls -la "$test_dir" | head -5
            else
              echo "  ❌ $test_dir NÃO EXISTE!"
            fi
          done
          
          echo ""
          echo "🔍 Procurando qualquer arquivo .robot no projeto:"
          find . -name "*.robot" -type f | head -10
          
          echo ""
          echo "🔍 Verificando se há testes em outros locais:"
          for possible_dir in tests test src .; do
            if find "$possible_dir" -maxdepth 2 -name "*.robot" -type f 2>/dev/null | grep -q .; then
              echo "  📁 Encontrados arquivos .robot em: $possible_dir"
              find "$possible_dir" -maxdepth 2 -name "*.robot" -type f | head -5
            fi
          done

      - name: Run E2E Tests
        run: |
          echo "🚀 Executando testes para o navegador: ${{ matrix.browser }}"
          
          # Browser já vem em lowercase da matriz
          BROWSER="${{ matrix.browser }}"
          
          # Configurar display para execução headless
          export DISPLAY=:99
          
          # ⚡ CONFIGURAÇÕES OTIMIZADAS
          echo "📊 Configurações de timeout otimizadas:"
          echo "  - Screenshot timeout: 30s"
          echo "  - Implicit wait: 10s"
          echo "  - Page load timeout: 30s"
          echo "  - Selenium speed: 0.2s"
          echo ""
          
          # 🔧 Configurações específicas por navegador
          if [ "$BROWSER" = "firefox" ]; then
            echo "🦊 Configurações específicas para Firefox:"
            echo "  - Viewport maior para evitar MoveTargetOutOfBounds"
            echo "  - Scroll behavior otimizado"
            echo "  - Timeouts aumentados"
            WINDOW_SIZE="1920x1200"
            SELENIUM_SPEED="0.5"
            IMPLICIT_WAIT="15"
          else
            WINDOW_SIZE="1920x1080"
            SELENIUM_SPEED="0.2"
            IMPLICIT_WAIT="10"
          fi
          
          # 🔍 Verificação final antes da execução
          echo "🔍 Verificação final dos diretórios de teste:"
          TEST_DIRS=""
          for test_dir in automacao_basico/tests automacao_intermediario/tests automacao_avancado/tests; do
            if [ -d "$test_dir" ] && find "$test_dir" -name "*.robot" | grep -q .; then
              TEST_DIRS="$TEST_DIRS $test_dir"
              echo "  ✅ $test_dir será incluído"
            else
              echo "  ⚠️ $test_dir não contém arquivos .robot - ignorando"
            fi
          done
          
          # Se nenhum diretório de teste foi encontrado, procurar em outros locais
          if [ -z "$TEST_DIRS" ]; then
            echo "🔍 Nenhum teste encontrado nos diretórios esperados. Procurando em outros locais..."
            
            # Tentar diretório raiz
            if find . -maxdepth 1 -name "*.robot" | grep -q .; then
              TEST_DIRS="."
              echo "  ✅ Encontrados testes no diretório raiz"
            # Tentar pasta tests genérica
            elif [ -d "tests" ] && find tests -name "*.robot" | grep -q .; then
              TEST_DIRS="tests"
              echo "  ✅ Encontrados testes em ./tests"
            else
              echo "  ❌ ERRO: Nenhum arquivo .robot encontrado em lugar algum!"
              echo "  📁 Listando toda a estrutura para debug:"
              find . -type f -name "*.robot" -o -name "*.resource" | head -20
              exit 1
            fi
          fi
          
          echo ""
          echo "🚀 Executando Robot Framework com os seguintes diretórios: $TEST_DIRS"
          
          # Executar Robot Framework com configurações otimizadas
          set +e
          
          robot \
            --name "Tests E2E - Robot Framework CI (${{ matrix.browser }})" \
            --outputdir ./tests-results-CI/${{ matrix.browser }} \
            --variable BROWSER:$BROWSER \
            --variable HEADLESS:true \
            --variable TIMEOUT:30 \
            --variable WINDOW_SIZE:$WINDOW_SIZE \
            --variable SELENIUM_SPEED:$SELENIUM_SPEED \
            --variable CAPTURE_PAGE_SCREENSHOT_ON_FAILURE:true \
            --variable BROWSER_PREFIX:${{ matrix.browser }} \
            --variable SCREENSHOT_TIMEOUT:30 \
            --variable IMPLICIT_WAIT:$IMPLICIT_WAIT \
            --variable PAGE_LOAD_TIMEOUT:30 \
            --variable SCROLL_BEHAVIOR:smooth \
            --variable ENABLE_JAVASCRIPT:true \
            --loglevel INFO \
            --reporttitle "Relatório E2E - ${{ matrix.browser }}" \
            --name "Relatório E2E - ${{ matrix.browser }}" \
            --maxerrorlines 10 \
            --include "*" \
            $TEST_DIRS
          
          ROBOT_EXIT_CODE=$?
          echo "Robot Framework finalizado com código: $ROBOT_EXIT_CODE"
          
          if [ $ROBOT_EXIT_CODE -eq 0 ]; then
            echo "✅ PERFEITO! Todos os testes passaram!"
            exit 0
          elif [ $ROBOT_EXIT_CODE -le 250 ]; then
            echo "⚠️ Alguns testes falharam, mas a execução foi bem-sucedida"
            echo "📊 Relatórios gerados com sucesso para análise"
            exit 0
          else
            echo "❌ Erro crítico na execução dos testes (código $ROBOT_EXIT_CODE)"
            
            # Debug adicional em caso de erro crítico
            echo ""
            echo "🔍 DEBUG: Verificando se algum arquivo foi gerado mesmo com erro:"
            ls -la ./tests-results-CI/${{ matrix.browser }}/ || echo "Diretório de resultados não existe"
            
            echo ""
            echo "🔍 DEBUG: Verificando logs do Robot Framework:"
            if [ -f "./tests-results-CI/${{ matrix.browser }}/log.html" ]; then
              echo "Log encontrado - extraindo últimas linhas de erro:"
              grep -i "error\|fatal\|exception" "./tests-results-CI/${{ matrix.browser }}/log.html" | tail -5 || true
            fi
            
            exit 1
          fi

      - name: Debug Firefox Issues
        if: always() && matrix.browser == 'firefox'
        run: |
          echo "🦊 Diagnóstico específico para Firefox..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          # Verificar se há erros MoveTargetOutOfBounds no log
          if [ -f "$RESULTS_DIR/log.html" ]; then
            echo "🔍 Verificando erros MoveTargetOutOfBounds no log..."
            if grep -q "MoveTargetOutOfBounds" "$RESULTS_DIR/log.html"; then
              echo "⚠️ Encontrados erros MoveTargetOutOfBounds - revisar configurações de viewport"
            else
              echo "✅ Nenhum erro MoveTargetOutOfBounds detectado"
            fi
          fi
          
          # Verificar configuração da janela
          echo "🖥️ Configurações aplicadas:"
          echo "  - Window Size: 1920x1200 (maior para Firefox)"
          echo "  - Selenium Speed: 0.5s (mais lento para estabilidade)"
          echo "  - Implicit Wait: 15s (aumentado para Firefox)"
        continue-on-error: true

      - name: Verify test artifacts 
        if: always()
        run: |
          echo "📸 Verificando artefatos de teste para ${{ matrix.browser }}..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          IMAGES=$(find "$RESULTS_DIR" -name "*.png" -type f 2>/dev/null | wc -l)
          echo "✅ Screenshots capturados: $IMAGES"
        continue-on-error: true

      - name: Verify reports generated
        if: always()
        run: |
          echo "🔍 Verificando relatórios gerados para ${{ matrix.browser }}..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          [ -f "$RESULTS_DIR/output.xml" ] && echo "✅ output.xml" || echo "❌ output.xml"
          [ -f "$RESULTS_DIR/report.html" ] && echo "✅ report.html" || echo "❌ report.html" 
          [ -f "$RESULTS_DIR/log.html" ] && echo "✅ log.html" || echo "❌ log.html"



      - name: Upload Test Results (Essential Files Only)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests-results-CI/${{ matrix.browser }}/output.xml
            tests-results-CI/${{ matrix.browser }}/report.html
            tests-results-CI/${{ matrix.browser }}/log.html
            tests-results-CI/${{ matrix.browser }}/*.png
            tests-results-CI/${{ matrix.browser }}/screenshots_*/
          retention-days: 7
          if-no-files-found: warn

  # Job para consolidar resultados e publicar no GitHub Pages
  publish-results:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: ./all-results

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Initialize GitHub Pages structure
        run: |
          echo "�️ Inicializando estrutura otimizada do GitHub Pages..."
          mkdir -p ./gh-pages
          mkdir -p ./gh-pages/relatorio-consolidado
          
          echo "✨ ESTRATÉGIA OTIMIZADA SEM DUPLICAÇÃO:"
          echo "1. ✅ Organização direta em estrutura screenshots_* final"
          echo "2. ✅ Cada imagem copiada apenas uma vez por destino"
          echo "3. ✅ Zero imagens soltas no diretório raiz"
          echo "4. ✅ Estrutura preservada para Set Screenshot Directory"
          echo "5. ✅ Máxima eficiência de armazenamento"
          echo "6. ✅ GitHub Pages totalmente compatível"
          echo ""
        continue-on-error: true

      - name: Create consolidated report with rebot
        run: |
          echo "📊 Gerando relatórios consolidados..."
          
          # Encontrar todos os arquivos output.xml
          OUTPUT_FILES=$(find ./all-results -name "output.xml" -type f 2>/dev/null)
          
          if [ -z "$OUTPUT_FILES" ]; then
            echo "⚠️ Nenhum arquivo output.xml encontrado - criando página de fallback..."
            mkdir -p ./gh-pages
            cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <title>Relatório E2E - Aguardando</title>
            <meta charset="utf-8">
          </head>
          <body>
            <h1>Pipeline em Execução</h1>
            <p>Os testes estão sendo executados. Relatórios disponíveis em breve.</p>
          </body>
          </html>
          EOF
          else
            echo "✅ Consolidando relatórios com rebot..."
            mkdir -p ./gh-pages/relatorio-consolidado
            
            # Gerar relatório consolidado diretamente no destino final
            rebot --name "Relatório E2E Consolidado - Todos os Navegadores" \
                  --reporttitle "Relatório E2E - CI Pipeline" \
                  --outputdir ./gh-pages/relatorio-consolidado \
                  --merge \
                  $OUTPUT_FILES
            
            # ESTRATÉGIA OTIMIZADA: Organizar imagens DIRETAMENTE nas pastas screenshots_* finais
            echo "🎯 ESTRATÉGIA OTIMIZADA: Organização direta em estrutura screenshots_*..."
            mkdir -p ./gh-pages/relatorio-consolidado
            
            # Criar pastas screenshots_* no destino final (usando lowercase direto)
            for browser in chrome firefox edge; do
              mkdir -p "./gh-pages/relatorio-consolidado/screenshots_$browser"
            done
            
            TOTAL_ORGANIZED=0
            for browser in chrome firefox edge; do
              BROWSER_DIR="./all-results/test-results-$browser"
              DEST_SCREENSHOTS="./gh-pages/relatorio-consolidado/screenshots_$BROWSER_LOWERCASE"
              
              if [ -d "$BROWSER_DIR" ]; then
                PNG_COUNT=0
                
                # Copiar imagens do diretório principal DIRETAMENTE para a pasta final
                if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                  MAIN_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                  find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                  PNG_COUNT=$((PNG_COUNT + MAIN_COUNT))
                  echo "   📸 $MAIN_COUNT imagens principais do $browser → screenshots_$BROWSER_LOWERCASE/"
                fi
                
                # Copiar imagens das pastas screenshots_* DIRETAMENTE para a pasta final
                find "$BROWSER_DIR" -type d -name "screenshots_*" | while read screenshot_dir; do
                  if [ -d "$screenshot_dir" ] && find "$screenshot_dir" -name "*.png" -type f | grep -q .; then
                    SUBDIR_COUNT=$(find "$screenshot_dir" -name "*.png" -type f | wc -l)
                    find "$screenshot_dir" -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                    echo "   ✨ $SUBDIR_COUNT imagens de $(basename "$screenshot_dir") → screenshots_$BROWSER_LOWERCASE/"
                  fi
                done
                
                if [ $PNG_COUNT -gt 0 ]; then
                  TOTAL_ORGANIZED=$((TOTAL_ORGANIZED + PNG_COUNT))
                  echo "   ✅ $browser: $PNG_COUNT imagens organizadas (sem duplicação)"
                fi
              fi
            done
            
            echo "📊 Total de imagens organizadas: $TOTAL_ORGANIZED"
            echo "🎯 Estrutura final: screenshots_chrome/, screenshots_firefox/, screenshots_edge/"
            echo "✅ ZERO duplicação - cada imagem em apenas UM local"
            
            # Links temporários para rebot (usando lowercase direto)
            echo "🔗 Preparando imagens para consolidação..."
            for browser in chrome firefox edge; do
              SRC_DIR="./gh-pages/relatorio-consolidado/screenshots_$browser"
              if [ -d "$SRC_DIR" ] && find "$SRC_DIR" -name "*.png" -type f | grep -q .; then
                find "$SRC_DIR" -name "*.png" -type f -exec cp {} "./gh-pages/" \;
              fi
            done
            
            cd ./gh-pages
            python -m robot.rebot \
              --output output.xml \
              --log log.html \
              --report report.html \
              --reporttitle "Relatório Consolidado E2E" \
              --name "Relatório Consolidado E2E" \
              ../all-results/*/output.xml || true
            
            # Remover links temporários após rebot para evitar duplicação
            echo "🧹 Removendo links temporários para evitar duplicação..."
            find . -maxdepth 1 -name "*.png" -type f -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.png" -type l -delete 2>/dev/null || true
            cd ..

            REBOT_EXIT_CODE=$?
            echo "Robot.rebot finalizado com código: $REBOT_EXIT_CODE"
            
            if [ $REBOT_EXIT_CODE -eq 0 ]; then
              echo "✅ Relatório consolidado gerado com sucesso - todos os testes passaram!"
            elif [ $REBOT_EXIT_CODE -le 250 ]; then
              echo "⚠️ Relatório consolidado gerado com alguns testes falhando (código $REBOT_EXIT_CODE)"
              echo "📊 Relatório disponível para análise das falhas"
            else
              echo "❌ Erro na geração do relatório (código $REBOT_EXIT_CODE)"
            fi
            
            echo "📊 Relatório consolidado gerado com organização otimizada!"
          fi
        continue-on-error: true

      - name: Organize individual reports
        run: |
          echo "📁 Organizando relatórios individuais de forma simplificada..."
          
          # Processar cada navegador de forma direta
          for browser in chrome firefox edge; do
            echo "📊 Processando $browser..."
            
            BROWSER_DIR="./all-results/test-results-$browser"
            TARGET_DIR="./gh-pages/execucao-$browser"
            
            if [ -d "$BROWSER_DIR" ]; then
              mkdir -p "$TARGET_DIR"
              
              # Copiar arquivos de relatório diretamente
              cp -f "$BROWSER_DIR"/*.{html,xml} "$TARGET_DIR/" 2>/dev/null || true
              
              # Copiar todos os screenshots preservando estrutura original
              find "$BROWSER_DIR" -name "*.png" -type f | while read img; do
                # Preservar caminho relativo da imagem
                rel_path=$(realpath --relative-to="$BROWSER_DIR" "$img")
                target_path="$TARGET_DIR/$rel_path"
                mkdir -p "$(dirname "$target_path")"
                cp "$img" "$target_path"
              done
              
              echo "   ✅ Relatório $browser organizado"
            fi
          done
          
          echo "✅ Relatório consolidado gerado!"
          fi
        continue-on-error: true

      - name: Create asset index page
        run: |
          echo "📝 Criando página de índice de assets..."
          
          cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Relatórios E2E - Robot Framework</title>
            <style>
              body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                margin: 0; 
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
              }
              .container { 
                max-width: 1200px; 
                margin: 0 auto; 
                background: white; 
                padding: 40px; 
                border-radius: 16px; 
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
              }
              h1 { 
                color: #2d3748; 
                text-align: center; 
                font-size: 2.5em; 
                margin-bottom: 10px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }
              .subtitle {
                text-align: center;
                color: #718096;
                margin-bottom: 40px;
                font-size: 1.1em;
              }
              .asset-grid { 
                display: grid; 
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
                gap: 25px; 
                margin: 30px 0;
              }
              .asset-card { 
                border: 2px solid #e2e8f0;
                border-radius: 12px; 
                padding: 25px; 
                background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
              }
              .asset-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
              }
              .asset-card:hover { 
                transform: translateY(-5px); 
                box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
                border-color: #667eea;
              }
              .asset-card h3 { 
                margin-top: 0; 
                color: #2d3748;
                font-size: 1.3em;
                display: flex;
                align-items: center;
