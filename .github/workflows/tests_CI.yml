          echo "✅ Página principal criada: index.html"
          echo "📊 Estrutura de navegação pronta para GitHub Pages"
        continue-on-error: true

      - name: Final validation
        run: |
          echo "🔍 Validação final da estrutura GitHub Pages..."
          
          # Contar arquivos essenciais
          CONSOLIDATED=$(find ./gh-pages/relatorio-consolidado -name "*.html" 2>/dev/null | wc -l)
          INDIVIDUAL=$(find ./gh-pages/execucao-* -name "*.html" 2>/dev/null | wc -l)
          IMAGES=$(find ./gh-pages -name "*.png" 2>/dev/null | wc -l)
          
          echo "✅ Relatórios consolidados: $CONSOLIDATED"
          echo "✅ Relatórios individuais: $INDIVIDUAL" 
          echo "✅ Total de screenshots: $IMAGES"
          echo "📦 Estrutura pronta para GitHub Pages!"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: publish-results
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        
      - name: Display Pages URL
        if: always()
        run: |
          if [ "${{ steps.deployment.outputs.page_url }}" != "" ]; then
            echo "🌐 GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"
            echo "✅ Relatórios disponíveis em: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "📋 Links diretos:"
            echo "   Consolidado: ${{ steps.deployment.outputs.page_url }}relatorio-consolidado/report.html"
            echo "   Chrome: ${{ steps.deployment.outputs.page_url }}execucao-chrome/report.html"
            echo "   Firefox: ${{ steps.deployment.outputs.page_url }}execucao-firefox/report.html"
            echo "   Edge: ${{ steps.deployment.outputs.page_url }}execucao-edge/report.html"
          else
            echo "📦 Relatórios disponíveis nos artefatos"
          fi
