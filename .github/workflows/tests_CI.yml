# 🤖 Pipeline de Testes E2E com Robot Framework + Selenium
# 
# Esta pipeline executa testes automatizados end-to-end em múltiplos navegadores,
# gera relatórios consolidados e publica os resultados no GitHub Pages.
#
# Funcionalidades:
# - ✅ Execução em múltiplos navegadores: Chrome, Firefox e Edge
# - 🐧 Execução em Ubuntu com Robot Framework e Selenium
# - 📊 Relatórios HTML consolidados
# - 🚀 Deploy automático no GitHub Pages

name: E2E Tests - Selenium + Robot Framework
run-name: Testes E2E (${{ github.ref_name }}) - ${{ github.actor }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      browser:
        description: "Em qual navegador os testes devem ser executados?"
        required: false
        default: "todos"
        type: choice
        options:
          - todos
          - chrome
          - firefox
          - edge

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  statuses: write
  checks: write

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "v1"

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Matriz simplificada - sempre lowercase, elimina conversão posterior
        browser: ${{ 
          github.event_name == 'workflow_dispatch' && github.event.inputs.browser != 'todos' 
          ? fromJSON(format('["{0}"]', github.event.inputs.browser)) 
          : fromJSON('["chrome", "firefox", "edge"]') 
        }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # 🚀 ALTERNATIVA MODERNA: Service container para Xvfb (descomente se preferir)
    # services:
    #   xvfb:
    #     image: ghcr.io/browserless/base:latest
    #     options: >-
    #       --tmpfs /tmp:exec,noatime
    #       --shm-size=2gb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Instalar webdriver-manager (versão mais recente compatível)
          pip install "webdriver-manager>=4.0.0,<5.0.0"
          
          # Instalar Selenium (versão LTS estável)
          pip install "selenium>=4.15.0,<5.0.0"
          
          echo "Instalando dependências específicas dos módulos..."
          INSTALLED_MODULES=()
          
          for module in automacao_basico automacao_intermediario automacao_avancado; do
            if [ -f "$module/requirements.txt" ]; then
              echo "Instalando dependências de $module..."
              pip install -r "$module/requirements.txt"
              INSTALLED_MODULES+=("$module")
              echo "Dependências de $module instaladas"
            else
              echo "requirements.txt não encontrado em $module"
            fi
          done
          
          if [ -f "requirements.txt" ]; then
            echo "Instalando dependências globais..."
            pip install -r "requirements.txt"
            echo "Dependências globais instaladas"
          fi
          
          echo "Módulos com dependências instaladas: ${INSTALLED_MODULES[*]}"
          
          # Verificar versões instaladas
          echo "Verificando versões instaladas:"
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"

      # 🚀 Setup automático do Edge com action oficial
      - name: Setup Microsoft Edge
        if: matrix.browser == 'Edge'
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable
        
      - name: Verify Edge Installation
        if: matrix.browser == 'Edge'
        run: |
          echo "✅ Verificando instalação do Edge..."
          EDGE_VERSION=$(microsoft-edge --version 2>/dev/null || edge --version 2>/dev/null)
          echo "Edge instalado: $EDGE_VERSION"
          
          echo ""
          echo "🎯 EdgeDriver será gerenciado automaticamente pelo Selenium"
          echo "   Nenhuma configuração manual necessária!"
          
          # Verificar se Edge está funcionando
          echo "Testando Edge headless..."
          timeout 10s microsoft-edge --headless --disable-gpu --no-sandbox --version || echo "Edge headless OK"

      - name: Create results directory
        run: |
          mkdir -p ./tests-results-CI/${{ matrix.browser }}
          echo "Diretório de resultados criado: ./tests-results-CI/${{ matrix.browser }}"
          
      - name: Setup Browser Environment
        run: |
          echo "Configurando ambiente para execução..."
          
          # Verificar Robot Framework e bibliotecas instaladas
          echo "Robot Framework: $(robot --version 2>/dev/null || echo 'Não encontrado')"
          echo "SeleniumLibrary: $(python -c 'import SeleniumLibrary; print(SeleniumLibrary.__version__)' 2>/dev/null || echo 'Não encontrada')"
          echo "Selenium: $(python -c 'import selenium; print(selenium.__version__)' 2>/dev/null || echo 'Não encontrado')"
          
          # Verificar navegadores disponíveis
          echo "VERIFICAÇÃO DE NAVEGADORES:"
          echo "=========================================="
          
          if command -v google-chrome &> /dev/null; then
            echo "✅ Chrome: $(google-chrome --version)"
          fi
          
          if command -v firefox &> /dev/null; then
            echo "✅ Firefox: $(firefox --version)"
          fi
          
          if command -v microsoft-edge &> /dev/null || command -v edge &> /dev/null; then
            echo "✅ Edge: $(microsoft-edge --version 2>/dev/null || edge --version 2>/dev/null)"
          fi
          
          echo "=========================================="
          
          # Ubuntu runners já têm Xvfb instalado - apenas configurar
          export DISPLAY=:99
          # Usar Xvfb nativo do runner com otimizações
          Xvfb :99 -screen 0 1920x1200x24 -ac +extension GLX +render -noreset -nolisten tcp > /dev/null 2>&1 &
          sleep 2
          echo "✅ Display virtual otimizado: $DISPLAY (1920x1200, Xvfb nativo do runner)"

      - name: Run E2E Tests
        run: |
          echo "🚀 Executando testes para o navegador: ${{ matrix.browser }}"
          
          # Browser já vem em lowercase da matriz - sem conversão necessária
          BROWSER="${{ matrix.browser }}"
          
          echo "Navegador configurado: $BROWSER"
          
          # Configurar display para execução headless
          export DISPLAY=:99
          
          # 🔧 CONFIGURAÇÕES ESPECÍFICAS POR NAVEGADOR
          if [ "$BROWSER" = "firefox" ]; then
            echo "🦊 FIREFOX - Configurações específicas para evitar MoveTargetOutOfBounds:"
            echo "  - Window Size: 1920x1200 (viewport maior)"
            echo "  - Selenium Speed: 0.5s (mais lento para estabilidade)"
            echo "  - Implicit Wait: 15s (aumentado para Firefox)"
            echo "  - Scroll Behavior: auto (scroll automático para elementos)"
            
            WINDOW_SIZE="1920x1200"
            SELENIUM_SPEED="0.5"
            IMPLICIT_WAIT="15"
            SCROLL_BEHAVIOR="auto"
            PAGE_LOAD_TIMEOUT="45"
          else
            echo "� $BROWSER - Configurações padrão otimizadas:"
            echo "  - Window Size: 1920x1080"
            echo "  - Selenium Speed: 0.2s"
            echo "  - Implicit Wait: 10s"
            
            WINDOW_SIZE="1920x1080"
            SELENIUM_SPEED="0.2"
            IMPLICIT_WAIT="10"
            SCROLL_BEHAVIOR="smooth"
            PAGE_LOAD_TIMEOUT="30"
          fi
          
          echo ""
          echo "📊 Configurações aplicadas:"
          echo "  - Screenshot timeout: 30s"
          echo "  - Window size: $WINDOW_SIZE"
          echo "  - Selenium speed: $SELENIUM_SPEED"
          echo "  - Implicit wait: ${IMPLICIT_WAIT}s"
          echo "  - Page load timeout: ${PAGE_LOAD_TIMEOUT}s"
          echo "  - Scroll behavior: $SCROLL_BEHAVIOR"
          echo ""
          
          # Executar Robot Framework com configurações específicas por navegador
          set +e
          
          robot \
            --name "Tests E2E - Robot Framework CI (${{ matrix.browser }})" \
            --outputdir ./tests-results-CI/${{ matrix.browser }} \
            --variable BROWSER:$BROWSER \
            --variable HEADLESS:true \
            --variable TIMEOUT:30 \
            --variable WINDOW_SIZE:$WINDOW_SIZE \
            --variable SELENIUM_SPEED:$SELENIUM_SPEED \
            --variable CAPTURE_PAGE_SCREENSHOT_ON_FAILURE:true \
            --variable BROWSER_PREFIX:${{ matrix.browser }} \
            --variable SCREENSHOT_TIMEOUT:30 \
            --variable IMPLICIT_WAIT:$IMPLICIT_WAIT \
            --variable PAGE_LOAD_TIMEOUT:$PAGE_LOAD_TIMEOUT \
            --variable SCROLL_BEHAVIOR:$SCROLL_BEHAVIOR \
            --variable SCROLL_INTO_VIEW:true \
            --variable FIREFOX_SAFE_MODE:true \
            --loglevel INFO \
            --reporttitle "Relatório E2E - ${{ matrix.browser }}" \
            --name "Relatório E2E - ${{ matrix.browser }}" \
            --maxerrorlines 10 \
            --include "*" \
            automacao_basico/tests automacao_intermediario/tests automacao_avancado/tests
          
          ROBOT_EXIT_CODE=$?
          echo "Robot Framework finalizado com código: $ROBOT_EXIT_CODE"
          
          if [ $ROBOT_EXIT_CODE -eq 0 ]; then
            echo "✅ PERFEITO! Todos os testes passaram!"
            exit 0
          elif [ $ROBOT_EXIT_CODE -le 250 ]; then
            echo "⚠️ Alguns testes falharam, mas a execução foi bem-sucedida"
            echo "📊 Relatórios gerados com sucesso para análise"
            exit 0
          else
            echo "❌ Erro crítico na execução dos testes"
            exit 1
          fi

      - name: Capture Screenshots and Evidence
        if: always()
        run: |
          echo "📸 Verificando evidências e screenshots gerados..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          BROWSER_LOWERCASE=$(echo "${{ matrix.browser }}" | tr '[:upper:]' '[:lower:]')
          SCREENSHOTS_DIR="$RESULTS_DIR/screenshots_$BROWSER_LOWERCASE"
          
          echo "🔍 Verificando em múltiplos locais:"
          echo "  📁 Diretório principal: $RESULTS_DIR"
          echo "  📁 Subpasta de screenshots: $SCREENSHOTS_DIR"
          
          # Contar screenshots no diretório principal
          IMAGES_MAIN=$(find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f 2>/dev/null | wc -l)
          
          # Contar screenshots na subpasta screenshots_${browser}
          IMAGES_SUBDIR=0
          if [ -d "$SCREENSHOTS_DIR" ]; then
            IMAGES_SUBDIR=$(find "$SCREENSHOTS_DIR" -name "*.png" -type f 2>/dev/null | wc -l)
          fi
          
          TOTAL_IMAGES=$((IMAGES_MAIN + IMAGES_SUBDIR))
          
          echo "📊 Resumo da coleta de evidências:"
          echo "  Screenshots no diretório principal: $IMAGES_MAIN"
          echo "  Screenshots na subpasta screenshots_$BROWSER_LOWERCASE/: $IMAGES_SUBDIR"
          echo "  ✅ Total de screenshots: $TOTAL_IMAGES"
          
          if [ $IMAGES_MAIN -gt 0 ]; then
            echo "  📸 Exemplos do diretório principal:"
            find "$RESULTS_DIR" -maxdepth 1 -name "*.png" -type f | head -3 | while read img; do
              echo "    - $(basename "$img")"
            done
          fi
          
          if [ $IMAGES_SUBDIR -gt 0 ]; then
            echo "  ✨ Exemplos da subpasta screenshots_$BROWSER_LOWERCASE/:"
            find "$SCREENSHOTS_DIR" -name "*.png" -type f | head -3 | while read img; do
              echo "    - $(basename "$img")"
            done
          fi
          
          if [ $TOTAL_IMAGES -eq 0 ]; then
            echo "  ⚠️ Nenhum screenshot encontrado em ambos os locais"
          fi
          
          # Debug: Listar TUDO que existe no diretório de resultados
          echo ""
          echo "🔍 DEBUG - Estrutura completa do diretório de resultados:"
          if [ -d "$RESULTS_DIR" ]; then
            find "$RESULTS_DIR" -type f -name "*.png" 2>/dev/null | head -10 | while read img; do
              echo "  📸 Encontrado: $img"
            done
            
            echo ""
            echo "📁 Estrutura de diretórios:"
            find "$RESULTS_DIR" -type d 2>/dev/null | head -5 | while read dir; do
              echo "  📂 $dir"
            done
          else
            echo "  ❌ Diretório $RESULTS_DIR não existe!"
          fi
        continue-on-error: true

      - name: Check Test Results
        if: always()
        run: |
          echo "🔍 Verificando resultados dos testes para ${{ matrix.browser }}..."
          RESULTS_DIR="./tests-results-CI/${{ matrix.browser }}"
          
          if [ -f "$RESULTS_DIR/output.xml" ]; then
            echo "✅ Arquivo output.xml encontrado!"
            echo "📁 Conteúdo do diretório de resultados:"
            ls -la "$RESULTS_DIR/"
            echo ""
            
            echo "📄 Arquivos de relatório gerados:"
            [ -f "$RESULTS_DIR/report.html" ] && echo "  ✅ report.html ($(stat -c%s "$RESULTS_DIR/report.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/log.html" ] && echo "  ✅ log.html ($(stat -c%s "$RESULTS_DIR/log.html" 2>/dev/null || echo "?") bytes)"
            [ -f "$RESULTS_DIR/output.xml" ] && echo "  ✅ output.xml ($(stat -c%s "$RESULTS_DIR/output.xml" 2>/dev/null || echo "?") bytes)"
          else
            echo "❌ Arquivo output.xml não encontrado!"
            echo "Conteúdo disponível no diretório:"
            ls -la "$RESULTS_DIR/" 2>/dev/null || echo "Diretório de resultados não existe"
          fi

      - name: Debug Upload Paths
        run: |
          echo "🔍 DEBUG - Verificando o que será incluído no upload:"
          BASE_PATH="tests-results-CI/${{ matrix.browser }}"
          
          echo ""
          echo "📄 Arquivos essenciais:"
          [ -f "$BASE_PATH/output.xml" ] && echo "  ✅ output.xml ($(stat -c%s "$BASE_PATH/output.xml" 2>/dev/null || echo "?") bytes)" || echo "  ❌ output.xml não encontrado"
          [ -f "$BASE_PATH/report.html" ] && echo "  ✅ report.html ($(stat -c%s "$BASE_PATH/report.html" 2>/dev/null || echo "?") bytes)" || echo "  ❌ report.html não encontrado"
          [ -f "$BASE_PATH/log.html" ] && echo "  ✅ log.html ($(stat -c%s "$BASE_PATH/log.html" 2>/dev/null || echo "?") bytes)" || echo "  ❌ log.html não encontrado"
          
          echo ""
          echo "📸 Screenshots no diretório principal:"
          find $BASE_PATH -maxdepth 1 -name "*.png" 2>/dev/null | head -5 | while read f; do echo "  📸 $f"; done || echo "  Nenhum PNG no diretório principal"
          
          echo ""
          echo "📸 Screenshots em subdiretórios screenshots_*:"
          find $BASE_PATH -path "*/screenshots_*/*.png" 2>/dev/null | head -10 | while read f; do echo "  📸 $f"; done || echo "  Nenhum PNG em subdiretórios screenshots_*"
          
          echo ""
          echo "📁 Todos os subdiretórios screenshots_*:"
          find $BASE_PATH -type d -name "screenshots_*" 2>/dev/null | while read d; do 
            echo "  📂 $d ($(find "$d" -name "*.png" 2>/dev/null | wc -l) PNGs)"
          done || echo "  Nenhum subdiretório screenshots_* encontrado"
          
          echo ""
          echo "🎯 Simulando padrões de upload:"
          echo "Pattern: $BASE_PATH/*.png"
          find $BASE_PATH -maxdepth 1 -name "*.png" 2>/dev/null | wc -l | xargs echo "  Matches:"
          echo "Pattern: $BASE_PATH/screenshots_*/"
          find $BASE_PATH -type d -name "screenshots_*" 2>/dev/null | wc -l | xargs echo "  Directories:"
        continue-on-error: true

      - name: Upload Test Results (Essential Files Only)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests-results-CI/${{ matrix.browser }}/output.xml
            tests-results-CI/${{ matrix.browser }}/report.html
            tests-results-CI/${{ matrix.browser }}/log.html
            tests-results-CI/${{ matrix.browser }}/*.png
            tests-results-CI/${{ matrix.browser }}/screenshots_*/
          retention-days: 7
          if-no-files-found: warn

  # Job para consolidar resultados e publicar no GitHub Pages
  publish-results:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: ./all-results

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Initialize GitHub Pages structure
        run: |
          echo "�️ Inicializando estrutura otimizada do GitHub Pages..."
          mkdir -p ./gh-pages
          mkdir -p ./gh-pages/relatorio-consolidado
          
          echo "✨ ESTRATÉGIA OTIMIZADA SEM DUPLICAÇÃO:"
          echo "1. ✅ Organização direta em estrutura screenshots_* final"
          echo "2. ✅ Cada imagem copiada apenas uma vez por destino"
          echo "3. ✅ Zero imagens soltas no diretório raiz"
          echo "4. ✅ Estrutura preservada para Set Screenshot Directory"
          echo "5. ✅ Máxima eficiência de armazenamento"
          echo "6. ✅ GitHub Pages totalmente compatível"
          echo ""
        continue-on-error: true

      - name: Create consolidated report with rebot
        run: |
          OUTPUT_FILES=$(find ./all-results -name "output.xml" -type f 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$OUTPUT_FILES" ]; then
            echo "⚠️ Nenhum arquivo output.xml encontrado. Criando página de status..."
            cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Relatório E2E - Status</title>
            <meta charset="utf-8">
          </head>
          <body>
            <h1>Pipeline em Execução</h1>
            <p>Os testes estão sendo executados. Os relatórios serão disponibilizados em breve.</p>
          </body>
          </html>
          EOF
          else
            echo "✅ Arquivos output.xml encontrados - gerando relatório consolidado..."
            
            # ESTRATÉGIA OTIMIZADA: Organizar imagens DIRETAMENTE nas pastas screenshots_* finais
            echo "🎯 ESTRATÉGIA OTIMIZADA: Organização direta em estrutura screenshots_*..."
            mkdir -p ./gh-pages/relatorio-consolidado
            
            # Criar pastas screenshots_* no destino final
            for browser in Chrome Firefox Edge; do
              BROWSER_LOWERCASE=$(echo "$browser" | tr '[:upper:]' '[:lower:]')
              mkdir -p "./gh-pages/relatorio-consolidado/screenshots_$BROWSER_LOWERCASE"
            done
            
            TOTAL_ORGANIZED=0
            for browser in Chrome Firefox Edge; do
              BROWSER_DIR="./all-results/test-results-$browser"
              BROWSER_LOWERCASE=$(echo "$browser" | tr '[:upper:]' '[:lower:]')
              DEST_SCREENSHOTS="./gh-pages/relatorio-consolidado/screenshots_$BROWSER_LOWERCASE"
              
              if [ -d "$BROWSER_DIR" ]; then
                PNG_COUNT=0
                
                # Copiar imagens do diretório principal DIRETAMENTE para a pasta final
                if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                  MAIN_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                  find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                  PNG_COUNT=$((PNG_COUNT + MAIN_COUNT))
                  echo "   📸 $MAIN_COUNT imagens principais do $browser → screenshots_$BROWSER_LOWERCASE/"
                fi
                
                # Copiar imagens das pastas screenshots_* DIRETAMENTE para a pasta final
                find "$BROWSER_DIR" -type d -name "screenshots_*" | while read screenshot_dir; do
                  if [ -d "$screenshot_dir" ] && find "$screenshot_dir" -name "*.png" -type f | grep -q .; then
                    SUBDIR_COUNT=$(find "$screenshot_dir" -name "*.png" -type f | wc -l)
                    find "$screenshot_dir" -name "*.png" -type f -exec cp {} "$DEST_SCREENSHOTS/" \;
                    echo "   ✨ $SUBDIR_COUNT imagens de $(basename "$screenshot_dir") → screenshots_$BROWSER_LOWERCASE/"
                  fi
                done
                
                if [ $PNG_COUNT -gt 0 ]; then
                  TOTAL_ORGANIZED=$((TOTAL_ORGANIZED + PNG_COUNT))
                  echo "   ✅ $browser: $PNG_COUNT imagens organizadas (sem duplicação)"
                fi
              fi
            done
            
            echo "📊 Total de imagens organizadas: $TOTAL_ORGANIZED"
            echo "🎯 Estrutura final: screenshots_chrome/, screenshots_firefox/, screenshots_edge/"
            echo "✅ ZERO duplicação - cada imagem em apenas UM local"
            
            # Para rebot, criar links simbólicos temporários das imagens para o diretório de execução
            echo "🔗 Criando links temporários para execução do rebot..."
            for browser in Chrome Firefox Edge; do
              BROWSER_LOWERCASE=$(echo "$browser" | tr '[:upper:]' '[:lower:]')
              SRC_DIR="./gh-pages/relatorio-consolidado/screenshots_$BROWSER_LOWERCASE"
              if [ -d "$SRC_DIR" ] && find "$SRC_DIR" -name "*.png" -type f | grep -q .; then
                find "$SRC_DIR" -name "*.png" -type f -exec ln -sf "../relatorio-consolidado/screenshots_$BROWSER_LOWERCASE/{}" "./gh-pages/{}" \; 2>/dev/null || \
                find "$SRC_DIR" -name "*.png" -type f -exec cp {} "./gh-pages/" \;
              fi
            done
            
            cd ./gh-pages
            python -m robot.rebot \
              --output output.xml \
              --log log.html \
              --report report.html \
              --reporttitle "Relatório Consolidado E2E" \
              --name "Relatório Consolidado E2E" \
              ../all-results/*/output.xml || true
            
            # Remover links temporários após rebot para evitar duplicação
            echo "🧹 Removendo links temporários para evitar duplicação..."
            find . -maxdepth 1 -name "*.png" -type f -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.png" -type l -delete 2>/dev/null || true
            cd ..

            REBOT_EXIT_CODE=$?
            echo "Robot.rebot finalizado com código: $REBOT_EXIT_CODE"
            
            if [ $REBOT_EXIT_CODE -eq 0 ]; then
              echo "✅ Relatório consolidado gerado com sucesso - todos os testes passaram!"
            elif [ $REBOT_EXIT_CODE -le 250 ]; then
              echo "⚠️ Relatório consolidado gerado com alguns testes falhando (código $REBOT_EXIT_CODE)"
              echo "📊 Relatório disponível para análise das falhas"
            else
              echo "❌ Erro na geração do relatório (código $REBOT_EXIT_CODE)"
            fi
            
            echo "📊 Relatório consolidado gerado com organização otimizada!"
          fi
        continue-on-error: true

      - name: Copy additional assets and fix image paths
        run: |
          echo "📁 Organizando assets finais sem duplicação..."
          
          # Criar estrutura de pastas para relatórios individuais
          for browser in Chrome Firefox Edge; do
            mkdir -p "./gh-pages/execucao-${browser,,}"
          done
          
          # Mover arquivos consolidados para pasta dedicada (já organizados no step anterior)
          echo "📊 Organizando relatórios consolidados..."
          if [ -f "./gh-pages/report.html" ]; then
            mv "./gh-pages/report.html" "./gh-pages/relatorio-consolidado/"
            echo "   ✅ report.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/log.html" ]; then
            mv "./gh-pages/log.html" "./gh-pages/relatorio-consolidado/"
            echo "   ✅ log.html → relatorio-consolidado/"
          fi
          if [ -f "./gh-pages/output.xml" ]; then
            mv "./gh-pages/output.xml" "./gh-pages/relatorio-consolidado/"
            echo "   ✅ output.xml → relatorio-consolidado/"
          fi
          
          # IMPORTANTE: Imagens JÁ estão organizadas em screenshots_* pelo step anterior
          echo "✅ Imagens já organizadas em estrutura screenshots_* sem duplicação"
          
          # Verificar estrutura de imagens consolidadas (já criada)
          echo "📊 Verificando estrutura de imagens consolidadas:"
          for browser in Chrome Firefox Edge; do
            BROWSER_LOWERCASE=$(echo "$browser" | tr '[:upper:]' '[:lower:]')
            SCREENSHOTS_DIR="./gh-pages/relatorio-consolidado/screenshots_$BROWSER_LOWERCASE"
            if [ -d "$SCREENSHOTS_DIR" ]; then
              IMG_COUNT=$(find "$SCREENSHOTS_DIR" -name "*.png" -type f | wc -l)
              echo "   📂 screenshots_$BROWSER_LOWERCASE/: $IMG_COUNT imagens"
            fi
          done
          
          # Organizar relatórios individuais por navegador (estrutura screenshots_* otimizada)
          echo "📄 Organizando relatórios individuais por navegador..."
          for browser in Chrome Firefox Edge; do
            BROWSER_DIR="./all-results/test-results-$browser"
            FOLDER_NAME="execucao-${browser,,}"
            BROWSER_LOWERCASE=$(echo "$browser" | tr '[:upper:]' '[:lower:]')
            
            if [ -d "$BROWSER_DIR" ]; then
              echo "  Processando $browser..."
              
              # Copiar arquivos HTML/XML
              [ -f "$BROWSER_DIR/report.html" ] && cp "$BROWSER_DIR/report.html" "./gh-pages/$FOLDER_NAME/"
              [ -f "$BROWSER_DIR/log.html" ] && cp "$BROWSER_DIR/log.html" "./gh-pages/$FOLDER_NAME/"
              [ -f "$BROWSER_DIR/output.xml" ] && cp "$BROWSER_DIR/output.xml" "./gh-pages/$FOLDER_NAME/"
              
              # OTIMIZAÇÃO: Criar estrutura screenshots_* para relatórios individuais
              mkdir -p "./gh-pages/$FOLDER_NAME/screenshots_$BROWSER_LOWERCASE"
              
              INDIVIDUAL_COUNT=0
              
              # Copiar imagens das pastas screenshots_* originais
              find "$BROWSER_DIR" -type d -name "screenshots_*" | while read screenshot_dir; do
                if [ -d "$screenshot_dir" ] && find "$screenshot_dir" -name "*.png" -type f | grep -q .; then
                  SUBDIR_COUNT=$(find "$screenshot_dir" -name "*.png" -type f | wc -l)
                  find "$screenshot_dir" -name "*.png" -type f -exec cp {} "./gh-pages/$FOLDER_NAME/screenshots_$BROWSER_LOWERCASE/" \;
                  echo "    ✨ $SUBDIR_COUNT imagens de $(basename "$screenshot_dir") → $FOLDER_NAME/screenshots_$BROWSER_LOWERCASE/"
                fi
              done
              
              # Copiar imagens do diretório principal para a pasta screenshots_* individual
              if find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | grep -q .; then
                MAIN_COUNT=$(find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f | wc -l)
                find "$BROWSER_DIR" -maxdepth 1 -name "*.png" -type f -exec cp {} "./gh-pages/$FOLDER_NAME/screenshots_$BROWSER_LOWERCASE/" \;
                echo "    📸 $MAIN_COUNT imagens principais → $FOLDER_NAME/screenshots_$BROWSER_LOWERCASE/"
                INDIVIDUAL_COUNT=$((INDIVIDUAL_COUNT + MAIN_COUNT))
              fi
              
              FINAL_COUNT=$(find "./gh-pages/$FOLDER_NAME/screenshots_$BROWSER_LOWERCASE" -name "*.png" -type f | wc -l)
              echo "    ✅ Total individual para $browser: $FINAL_COUNT imagens em screenshots_$BROWSER_LOWERCASE/"
            fi
          done
          
          # Corrigir caminhos das imagens nos arquivos HTML (estrutura screenshots_*)
          echo ""
          echo "🔧 Corrigindo caminhos das imagens nos arquivos HTML para usar estrutura screenshots_*..."
          
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              echo "   📄 Corrigindo $(basename "$html_file")..."
              
              # Primeiro, deixar os caminhos simples (sem path)
              sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
              sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
              
              # Mapear imagens para as pastas screenshots_* corretas
              echo "      🔍 Mapeando referências para pastas screenshots_*..."
              
              # Extrair todas as referências de imagens PNG
              SCREENSHOT_REFS=$(grep -oP '(src|href)="(\.\/)?[^"]*\.png"' "$html_file" 2>/dev/null | \
                               sed 's/src="//; s/href="//; s/\.\///; s/"//' | sort | uniq)
              
              if [ -n "$SCREENSHOT_REFS" ]; then
                MAPPED_COUNT=0
                UNMAPPED_COUNT=0
                
                while IFS= read -r screenshot; do
                  if [ -n "$screenshot" ]; then
                    # Procurar a imagem nas pastas screenshots_*
                    FOUND_IN=""
                    for screenshots_folder in $(find "./gh-pages/relatorio-consolidado" -type d -name "screenshots_*" | sort); do
                      if [ -f "$screenshots_folder/$screenshot" ]; then
                        FOUND_IN=$(basename "$screenshots_folder")
                        break
                      fi
                    done
                    
                    # Se não encontrou nas pastas screenshots_*, verificar se está no diretório principal
                    if [ -z "$FOUND_IN" ] && [ -f "./gh-pages/relatorio-consolidado/$screenshot" ]; then
                      # Imagem está no diretório principal, deixar como está
                      FOUND_IN="main"
                    fi
                    
                    if [ -n "$FOUND_IN" ] && [ "$FOUND_IN" != "main" ]; then
                      # Substituir referência para incluir pasta screenshots_*
                      sed -i "s|src=\"$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|src=\"\./$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|href=\"$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      sed -i "s|href=\"\./$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      
                      MAPPED_COUNT=$((MAPPED_COUNT + 1))
                    elif [ "$FOUND_IN" = "main" ]; then
                      # Imagem no diretório principal, não precisa alterar
                      MAPPED_COUNT=$((MAPPED_COUNT + 1))
                    else
                      UNMAPPED_COUNT=$((UNMAPPED_COUNT + 1))
                    fi
                  fi
                done <<< "$SCREENSHOT_REFS"
                
                echo "      ✅ Mapeadas: $MAPPED_COUNT | ⚠️ Não encontradas: $UNMAPPED_COUNT"
              else
                echo "      ℹ️ Nenhuma referência de selenium-screenshot encontrada"
              fi
              
              # Verificar resultado final
              FINAL_REFS=$(grep -c '\.png' "$html_file" 2>/dev/null || echo "0")
              echo "      📊 Total de referências processadas: $FINAL_REFS"
            fi
          done
          
          # Corrigir relatórios individuais (com estrutura screenshots_*)
          echo ""
          echo "🔧 Corrigindo caminhos nos relatórios individuais..."
          for browser in Chrome Firefox Edge; do
            FOLDER_NAME="execucao-${browser,,}"
            
            for html_file in ./gh-pages/$FOLDER_NAME/*.html; do
              if [ -f "$html_file" ]; then
                echo "   📄 Corrigindo $(basename "$html_file") para $browser..."
                
                # Primeiro, normalizar caminhos
                sed -i 's|src="[^"]*\/\([^/]*\.png\)"|src="./\1"|g' "$html_file" 2>/dev/null
                sed -i 's|href="[^"]*\/\([^/]*\.png\)"|href="./\1"|g' "$html_file" 2>/dev/null
                
                # Mapear imagens para pastas screenshots_* se existirem
                SCREENSHOT_REFS=$(grep -oP '(src|href)="(\.\/)?[^"]*\.png"' "$html_file" 2>/dev/null | \
                                 sed 's/src="//; s/href="//; s/\.\///; s/"//' | sort | uniq)
                
                if [ -n "$SCREENSHOT_REFS" ]; then
                  while IFS= read -r screenshot; do
                    if [ -n "$screenshot" ]; then
                      # Procurar nas pastas screenshots_* deste navegador
                      FOUND_IN=""
                      for screenshots_folder in $(find "./gh-pages/$FOLDER_NAME" -type d -name "screenshots_*" 2>/dev/null | sort); do
                        if [ -f "$screenshots_folder/$screenshot" ]; then
                          FOUND_IN=$(basename "$screenshots_folder")
                          break
                        fi
                      done
                      
                      if [ -n "$FOUND_IN" ]; then
                        # Atualizar referência para incluir pasta screenshots_*
                        sed -i "s|src=\"$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|src=\"\./$screenshot\"|src=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|href=\"$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                        sed -i "s|href=\"\./$screenshot\"|href=\"./$FOUND_IN/$screenshot\"|g" "$html_file" 2>/dev/null
                      fi
                    fi
                  done <<< "$SCREENSHOT_REFS"
                fi
              fi
            done
          done
          
          # Resumo da estrutura otimizada
          echo ""
          echo "📋 ESTRUTURA FINAL OTIMIZADA (sem duplicação):"
          echo "  📂 relatorio-consolidado/"
          echo "    ├── report.html, log.html, output.xml"
          echo "    ├── 📂 screenshots_chrome/ (imagens Chrome únicas)"
          echo "    ├── 📂 screenshots_firefox/ (imagens Firefox únicas)"
          echo "    └── 📂 screenshots_edge/ (imagens Edge únicas)"
          echo "  📂 execucao-chrome/"
          echo "    ├── report.html, log.html, output.xml"
          echo "    └── 📂 screenshots_chrome/ (cópia para visualização individual)"
          echo "  📂 execucao-firefox/ e execucao-edge/ (estrutura similar)"
          echo ""
          echo "✅ ELIMINAÇÃO COMPLETA DE DUPLICAÇÃO:"
          echo "   - Cada imagem existe apenas 2x: consolidado + individual"
          echo "   - Zero imagens soltas no diretório raiz"
          echo "   - Estrutura screenshots_* preservada em todos os relatórios"
          echo "   ✅ Assets organizados sem redundância!"
        continue-on-error: true

      - name: Create asset index page
        run: |
          echo "📝 Criando página de índice de assets..."
          
          cat > ./gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Relatórios E2E - Robot Framework</title>
            <style>
              body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                margin: 0; 
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
              }
              .container { 
                max-width: 1200px; 
                margin: 0 auto; 
                background: white; 
                padding: 40px; 
                border-radius: 16px; 
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
              }
              h1 { 
                color: #2d3748; 
                text-align: center; 
                font-size: 2.5em; 
                margin-bottom: 10px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }
              .subtitle {
                text-align: center;
                color: #718096;
                margin-bottom: 40px;
                font-size: 1.1em;
              }
              .asset-grid { 
                display: grid; 
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
                gap: 25px; 
                margin: 30px 0;
              }
              .asset-card { 
                border: 2px solid #e2e8f0;
                border-radius: 12px; 
                padding: 25px; 
                background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
              }
              .asset-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
              }
              .asset-card:hover { 
                transform: translateY(-5px); 
                box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
                border-color: #667eea;
              }
              .asset-card h3 { 
                margin-top: 0; 
                color: #2d3748;
                font-size: 1.3em;
                display: flex;
                align-items: center;
                gap: 10px;
              }
              .asset-list { 
                list-style: none; 
                padding: 0; 
                margin: 15px 0;
              }
              .asset-list li { 
                padding: 10px 0;
                border-bottom: 1px solid #e2e8f0;
              }
              .asset-list li:last-child {
                border-bottom: none;
              }
              .asset-list a { 
                text-decoration: none; 
                color: #5a67d8;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: all 0.2s;
              }
              .asset-list a:hover { 
                color: #4c51bf;
                padding-left: 5px;
              }
              .icon { 
                font-size: 1.5em;
              }
              .description { 
                font-size: 0.9em;
                color: #718096; 
                margin-top: 15px; 
                line-height: 1.6;
                padding: 12px;
                background: white;
                border-radius: 8px;
              }
              .info-section {
                margin-top: 50px;
                padding: 30px;
                background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
                border-radius: 12px;
                border-left: 5px solid #48bb78;
              }
              .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-top: 20px;
              }
              .info-item h4 {
                color: #2d3748;
                margin: 0 0 10px 0;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .info-item p {
                margin: 0;
                color: #718096;
                font-size: 0.95em;
                line-height: 1.5;
              }
              .footer {
                text-align: center;
                margin-top: 40px;
                padding-top: 20px;
                border-top: 2px solid #e2e8f0;
                color: #718096;
              }
              .badge {
                display: inline-block;
                padding: 4px 12px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border-radius: 20px;
                font-size: 0.85em;
                font-weight: 600;
                margin-left: 10px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🔗 Relatórios de Testes E2E</h1>
              <p class="subtitle">Pipeline automatizada com Robot Framework + Selenium</p>
              
              <div class="asset-grid">
                <div class="asset-card">
                  <h3><span class="icon">📇</span>Relatório Consolidado<span class="badge">Todos</span></h3>
                  <ul class="asset-list">
                    <li><a href="relatorio-consolidado/report.html">📊 Relatório Unificado</a></li>
                    <li><a href="relatorio-consolidado/log.html">📋 Log Detalhado</a></li>
                    <li><a href="relatorio-consolidado/output.xml">📄 XML Consolidado</a></li>
                  </ul>
                  <div class="description">
                    ✨ Visualização unificada de todos os testes executados nos três navegadores. 
                    Screenshots organizados por subpastas (chrome/, firefox/, edge/).
                  </div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="icon">🌐</span>Chrome<span class="badge">Individual</span></h3>
                  <ul class="asset-list">
                    <li><a href="execucao-chrome/report.html">📊 Relatório Chrome</a></li>
                    <li><a href="execucao-chrome/log.html">📋 Log Chrome</a></li>
                    <li><a href="execucao-chrome/output.xml">📄 XML Chrome</a></li>
                  </ul>
                  <div class="description">
                    🎯 Resultados específicos da execução no Google Chrome com screenshots próprios.
                  </div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="icon">🦊</span>Firefox<span class="badge">Individual</span></h3>
                  <ul class="asset-list">
                    <li><a href="execucao-firefox/report.html">📊 Relatório Firefox</a></li>
                    <li><a href="execucao-firefox/log.html">📋 Log Firefox</a></li>
                    <li><a href="execucao-firefox/output.xml">📄 XML Firefox</a></li>
                  </ul>
                  <div class="description">
                    🎯 Resultados específicos da execução no Mozilla Firefox com screenshots próprios.
                  </div>
                </div>
                
                <div class="asset-card">
                  <h3><span class="icon">🌊</span>Edge<span class="badge">Individual</span></h3>
                  <ul class="asset-list">
                    <li><a href="execucao-edge/report.html">📊 Relatório Edge</a></li>
                    <li><a href="execucao-edge/log.html">📋 Log Edge</a></li>
                    <li><a href="execucao-edge/output.xml">📄 XML Edge</a></li>
                  </ul>
                  <div class="description">
                    🎯 Resultados específicos da execução no Microsoft Edge com screenshots próprios.
                  </div>
                </div>
              </div>
              
              <div class="info-section">
                <h3 style="margin-top: 0; color: #2d3748; display: flex; align-items: center; gap: 10px;">
                  <span class="icon">ℹ️</span>Sobre os Relatórios
                </h3>
                <div class="info-grid">
                  <div class="info-item">
                    <h4><span class="icon">1️⃣</span>Estrutura Organizada</h4>
                    <p>Screenshots organizados em subpastas por navegador (chrome/, firefox/, edge/) para evitar conflitos de nomenclatura.</p>
                  </div>
                  <div class="info-item">
                    <h4><span class="icon">2️⃣</span>Screenshots</h4>
                    <p>Todas as evidências visuais capturadas automaticamente durante a execução dos testes, mantendo nomes originais.</p>
                  </div>
                  <div class="info-item">
                    <h4><span class="icon">3️⃣</span>Consolidação</h4>
                    <p>O relatório consolidado unifica resultados de todos os navegadores em uma única visualização completa.</p>
                  </div>
                  <div class="info-item">
                    <h4><span class="icon">4️⃣</span>Análise Individual</h4>
                    <p>Relatórios separados por navegador para análise detalhada de comportamentos específicos.</p>
                  </div>
                </div>
              </div>
              
              <div class="footer">
                <p style="margin: 0; font-size: 0.95em;">
                  🤖 <strong>Gerado automaticamente pelo GitHub Actions</strong>
                </p>
                <p style="margin: 10px 0 0 0; font-size: 0.85em;">
                  Pipeline executada com Robot Framework + Selenium WebDriver
                </p>
              </div>
            </div>
          </body>
          </html>
          EOF
          
          echo "✅ Página principal criada: index.html"
          echo "📊 Estrutura de navegação pronta para GitHub Pages"
        continue-on-error: true

      - name: Validate image organization
        run: |
          echo ""
          echo "🔍 Validação final da organização de imagens..."
          
          # Validar estrutura de subpastas no consolidado
          for browser in chrome firefox edge; do
            SUBFOLDER="./gh-pages/relatorio-consolidado/$browser"
            if [ -d "$SUBFOLDER" ]; then
              IMG_COUNT=$(find "$SUBFOLDER" -name "*.png" -type f 2>/dev/null | wc -l)
              echo "   📂 relatorio-consolidado/$browser/: $IMG_COUNT imagens"
              
              if [ $IMG_COUNT -gt 0 ]; then
                echo "      ✅ Subpasta criada com sucesso"
                echo "      Exemplos:"
                find "$SUBFOLDER" -name "*.png" -type f | head -3 | sed 's|^./gh-pages/relatorio-consolidado/||; s/^/        /'
              fi
            else
              echo "   ⚠️ Subpasta não encontrada: $browser/"
            fi
          done
          
          echo ""
          
          # Validar relatórios individuais
          for browser in Chrome Firefox Edge; do
            FOLDER="./gh-pages/execucao-${browser,,}"
            if [ -d "$FOLDER" ]; then
              IMG_COUNT=$(find "$FOLDER" -name "*.png" -type f 2>/dev/null | wc -l)
              HTML_COUNT=$(find "$FOLDER" -name "*.html" -type f 2>/dev/null | wc -l)
              echo "   📂 execucao-${browser,,}/: $IMG_COUNT imagens, $HTML_COUNT HTMLs"
            fi
          done
          
          echo ""
          
          # Validar referências nos HTMLs consolidados
          echo "🔍 Validando referências de imagens nos HTMLs consolidados..."
          for html_file in ./gh-pages/relatorio-consolidado/*.html; do
            if [ -f "$html_file" ]; then
              FILENAME=$(basename "$html_file")
              
              # Contar referências com subpastas (chrome/, firefox/, edge/)
              SUBFOLDER_REFS=$(grep -c '\(chrome\|firefox\|edge\)/[^"]*\.png' "$html_file" 2>/dev/null || echo "0")
              
              # Contar referências diretas (sem subpasta - potencialmente quebradas)
              DIRECT_REFS=$(grep -c 'src="\./selenium-screenshot-[0-9]*\.png"' "$html_file" 2>/dev/null || echo "0")
              
              echo "   📄 $FILENAME:"
              echo "      ✅ Referências com subpastas: $SUBFOLDER_REFS"
              
              if [ $DIRECT_REFS -gt 0 ]; then
                echo "      ⚠️ Referências diretas (sem subpasta): $DIRECT_REFS"
                echo "         Estas referências podem estar quebradas!"
              else
                echo "      ✅ Nenhuma referência direta - todas mapeadas corretamente"
              fi
              
              # Mostrar exemplos de referências
              if [ $SUBFOLDER_REFS -gt 0 ]; then
                echo "      Exemplos de referências:"
                grep -o '\(chrome\|firefox\|edge\)/selenium-screenshot-[0-9]*\.png' "$html_file" 2>/dev/null | head -3 | sed 's/^/        .\//'
              fi
            fi
          done
          
          echo ""
          echo "📊 Resumo da validação:"
          
          TOTAL_CONSOLIDATED=$(find ./gh-pages/relatorio-consolidado -name "*.png" -type f 2>/dev/null | wc -l)
          TOTAL_INDIVIDUAL=$(find ./gh-pages/execucao-* -name "*.png" -type f 2>/dev/null | wc -l)
          
          echo "   Total de imagens no consolidado: $TOTAL_CONSOLIDATED"
          echo "   Total de imagens nas execuções individuais: $TOTAL_INDIVIDUAL"
          echo ""
          echo "✅ Validação concluída!"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: publish-results
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event.inputs.browser == 'todos'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        
      - name: Display Pages URL
        if: always()
        run: |
          if [ "${{ steps.deployment.outputs.page_url }}" != "" ]; then
            echo "🌐 GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"
            echo "✅ Relatórios disponíveis em: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "📋 Links diretos:"
